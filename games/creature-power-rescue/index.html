<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Creature Power Rescue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2140; --cream:#fffaf0; --teal:#2fa4d8; --sun:#ffc93c; --pink:#ff7aa8; --go:#3cc46a;
  --bar:clamp(54px,9vh,74px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe9ff;color:var(--ink);
  font-family:Andika,"Comic Sans MS",system-ui,sans-serif;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.top{height:var(--bar);flex:0 0 auto;display:flex;align-items:center;gap:clamp(4px,1.2vw,10px);
  padding:6px clamp(6px,1.5vw,14px);background:rgba(255,255,255,.82);box-shadow:0 3px 0 rgba(43,33,64,.08);z-index:5}
.ibtn{height:calc(var(--bar) - 14px);min-width:calc(var(--bar) - 14px);border-radius:18px;background:#fff;
  box-shadow:0 4px 0 #d5cfe6;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;
  font-weight:700;font-size:clamp(14px,2vw,18px)}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 #d5cfe6}
.ibtn svg{width:calc(var(--bar) - 28px);height:calc(var(--bar) - 28px)}
.ibtn.off{opacity:.45}
.hear{background:var(--sun);box-shadow:0 4px 0 #d9a21a;padding:0 14px}
.hear:active{box-shadow:0 1px 0 #d9a21a}
.spacer{flex:1}
.ttl{font-family:Grandstander,cursive;font-weight:900;font-size:clamp(15px,2.6vw,24px);color:#e05a8a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.screen{flex:1;min-height:0;position:relative;display:none;flex-direction:column}
.screen.on{display:flex}
.hidelabel{display:inline}
@media (max-width:560px){.hidelabel{display:none}}

/* title */
#title{align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#fff7d6 0,#bfe9ff 55%,#9fd8ff 100%);overflow:hidden;gap:clamp(6px,2vh,18px);padding:10px}
#title h1{margin:0;font-family:Grandstander,cursive;font-weight:900;text-align:center;line-height:.95;
  font-size:clamp(34px,8vw,84px);color:#ff6f9f;text-shadow:0 4px 0 #fff,0 8px 0 rgba(43,33,64,.15)}
#title h1 span{color:#2fa4d8;display:block}
#title .hi{font-family:Grandstander,cursive;font-size:clamp(20px,3.6vw,32px);font-weight:800;color:#5a4a8a}
.heroart{width:min(70vw,440px);height:min(30vh,240px)}
.big{font-family:Grandstander,cursive;font-weight:900;font-size:clamp(26px,5vw,44px);padding:.35em 1.3em;border-radius:999px;
  background:var(--go);color:#fff;box-shadow:0 7px 0 #249a4c;text-shadow:0 2px 0 rgba(0,0,0,.15);animation:pulse 1.6s ease-in-out infinite}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 #249a4c}
.big.alt{background:#8a63c9;box-shadow:0 7px 0 #6545a0;animation:none;font-size:clamp(20px,3.6vw,32px)}
.big.alt:active{box-shadow:0 2px 0 #6545a0}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}

/* map */
#map{background:linear-gradient(#bfe9ff,#e9f9ff);overflow:hidden;padding:clamp(8px,2vh,18px);align-items:center}
#map h2,#discs h2{margin:0 0 clamp(6px,1.5vh,14px);font-family:Grandstander,cursive;font-weight:900;font-size:clamp(22px,4vw,38px);color:#5a4a8a;text-align:center}
.tiles{flex:1;min-height:0;width:100%;max-width:1100px;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:clamp(6px,1.6vmin,16px)}
@media (min-aspect-ratio:3/2){.tiles{grid-template-columns:repeat(5,1fr)}}
.tile{position:relative;border-radius:24px;background:var(--c);box-shadow:0 6px 0 rgba(43,33,64,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;min-height:0;overflow:hidden}
.tile svg{width:100%;flex:1;min-height:0}
.tile .lab{font-weight:700;font-size:clamp(12px,1.9vw,18px);background:rgba(255,255,255,.8);border-radius:999px;padding:1px 10px;margin-bottom:4px;white-space:nowrap}
.tile .num{position:absolute;left:8px;top:6px;font-family:Grandstander,cursive;font-weight:900;font-size:clamp(16px,2.6vw,26px);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.tile .chk{position:absolute;right:6px;top:6px;width:clamp(26px,4vw,40px);height:clamp(26px,4vw,40px)}
.tile.later{filter:saturate(.35) brightness(1.05);opacity:.7}
.tile.next{outline:5px solid #fff;animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 0 rgba(255,201,60,.9),0 6px 0 rgba(43,33,64,.18)}to{box-shadow:0 0 0 12px rgba(255,201,60,.0),0 6px 0 rgba(43,33,64,.18);transform:scale(1.04)}}

/* play */
#play{background:#bfe9ff}
.stage{flex:1;min-height:0;position:relative;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cap{position:absolute;left:50%;top:clamp(6px,1.5vh,14px);transform:translateX(-50%);width:min(94%,900px);
  background:rgba(255,255,255,.92);border-radius:22px;padding:.45em .9em;font-size:clamp(16px,2.7vw,27px);line-height:1.25;
  text-align:center;box-shadow:0 5px 0 rgba(43,33,64,.12);font-weight:700;z-index:3;transition:opacity .3s}
.cap:empty{opacity:0}
.choices{flex:0 0 auto;display:flex;justify-content:center;gap:clamp(8px,2vw,22px);padding:clamp(8px,1.6vh,14px) clamp(8px,2vw,20px) max(clamp(8px,1.6vh,14px),env(safe-area-inset-bottom));
  background:rgba(255,255,255,.7);transition:transform .4s,opacity .4s}
.choices.gone{display:none}
.pw{flex:1;max-width:240px;height:clamp(104px,22vh,190px);border-radius:26px;background:#fff;box-shadow:0 7px 0 var(--d);
  border:5px solid var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;position:relative}
.pw svg{flex:1;min-height:0;width:100%}
.pw b{font-family:Grandstander,cursive;font-weight:800;font-size:clamp(15px,2.4vw,24px);color:var(--d);line-height:1.1;text-align:center}
.pw:active{transform:translateY(5px);box-shadow:0 2px 0 var(--d)}
.pw.tried{opacity:.55}
.pw.wob{animation:wob .5s}
@keyframes wob{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
.pw.hint{animation:hint 0.9s ease-in-out infinite alternate;opacity:1}
@keyframes hint{from{box-shadow:0 7px 0 var(--d),0 0 0 0 #ffe066}to{box-shadow:0 7px 0 var(--d),0 0 0 14px rgba(255,224,102,.85);transform:scale(1.07)}}

/* modal */
.modal{position:fixed;inset:0;background:rgba(43,33,64,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
.modal.on{display:flex}
.card{background:var(--cream);border-radius:32px;padding:clamp(14px,3vh,28px) clamp(16px,4vw,40px);text-align:center;max-width:560px;width:100%;
  box-shadow:0 10px 0 rgba(43,33,64,.2);animation:popin .5s cubic-bezier(.3,1.6,.5,1)}
.card h3{margin:0 0 6px;font-family:Grandstander,cursive;font-weight:900;font-size:clamp(24px,4.6vw,40px);color:#ff6f9f}
.card p{margin:4px 0 12px;font-size:clamp(17px,2.8vw,24px);font-weight:700}
.card .disc{width:min(44vw,34vh,230px);height:min(44vw,34vh,230px);animation:spinin 1s ease-out}
@keyframes popin{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes spinin{from{transform:rotate(-540deg) scale(.2)}to{transform:rotate(0) scale(1)}}

/* discs */
#discs{background:linear-gradient(#efe6ff,#fff6fb);padding:clamp(8px,2vh,18px);align-items:center;overflow:hidden}
#discs .count{font-weight:700;font-size:clamp(16px,2.4vw,22px);margin-bottom:8px}
.dgrid{flex:1;min-height:0;width:100%;max-width:1000px;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:clamp(6px,1.5vmin,14px)}
@media (min-aspect-ratio:3/2){.dgrid{grid-template-columns:repeat(5,1fr)}}
.dtile{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;background:#fff;border-radius:22px;box-shadow:0 5px 0 #ddd2f0;padding:4px}
.dtile svg{flex:1;min-height:0;width:100%}
.dtile b{font-family:Grandstander,cursive;font-size:clamp(13px,2vw,20px);font-weight:800}
.dtile:active{transform:translateY(3px)}

/* celebrate */
#celebrate{align-items:center;justify-content:center;background:radial-gradient(circle,#fff3c4,#ffc0da 60%,#c7b0ff);overflow:hidden;gap:clamp(6px,2vh,16px);padding:10px}
#celebrate h1{margin:0;font-family:Grandstander,cursive;font-weight:900;font-size:clamp(34px,8vw,80px);color:#fff;text-shadow:0 4px 0 #ff6f9f,0 8px 0 rgba(43,33,64,.2);text-align:center;line-height:1}
#celebrate p{margin:0;font-size:clamp(18px,3vw,28px);font-weight:700;text-align:center}
.ring{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:min(92vw,760px)}
.ring svg{width:clamp(56px,12vmin,110px);height:clamp(56px,12vmin,110px);animation:bob 1.4s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-10px) rotate(6deg)}}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.kidwig{animation:none}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <button class="ibtn" id="bHome" aria-label="Home"><svg viewBox="0 0 40 40"><path d="M6 20 L20 7 L34 20" fill="none" stroke="#5a4a8a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 18 V33 H17 V25 H23 V33 H30 V18" fill="#ffc93c" stroke="#5a4a8a" stroke-width="3.5" stroke-linejoin="round"/></svg></button>
    <button class="ibtn hear" id="bHear" aria-label="Hear it again"><svg viewBox="0 0 40 40"><path d="M7 15 H14 L23 7 V33 L14 25 H7 Z" fill="#fff" stroke="#5a4a8a" stroke-width="3" stroke-linejoin="round"/><path d="M28 13 Q33 20 28 27 M31 9 Q39 20 31 31" fill="none" stroke="#5a4a8a" stroke-width="3" stroke-linecap="round"/></svg><span class="hidelabel">Hear it again</span></button>
    <div class="spacer"></div>
    <div class="ttl" id="topTitle">Creature Power Rescue</div>

    <button class="ibtn" id="bVoice" aria-label="Voice on or off"><svg viewBox="0 0 40 40"><circle cx="16" cy="16" r="9" fill="#ffd9b8" stroke="#5a4a8a" stroke-width="3"/><path d="M5 35 Q16 22 27 35" fill="#7fc8f8" stroke="#5a4a8a" stroke-width="3"/><path d="M30 12 q4 4 0 8 M33 9 q7 7 0 14" fill="none" stroke="#5a4a8a" stroke-width="2.6" stroke-linecap="round"/><line class="slash" x1="5" y1="5" x2="35" y2="35" stroke="#e0445a" stroke-width="4" stroke-linecap="round"/></svg></button>
    <button class="ibtn" id="bSound" aria-label="Sound on or off"><svg viewBox="0 0 40 40"><path d="M15 28 V9 L31 6 V25" fill="none" stroke="#5a4a8a" stroke-width="3.5" stroke-linejoin="round"/><ellipse cx="11" cy="28" rx="5.5" ry="4.5" fill="#8a63c9"/><ellipse cx="27" cy="25" rx="5.5" ry="4.5" fill="#8a63c9"/><line class="slash" x1="5" y1="5" x2="35" y2="35" stroke="#e0445a" stroke-width="4" stroke-linecap="round"/></svg></button>
  </div>

  <section class="screen on" id="title">
    <svg class="heroart" id="heroArt" viewBox="-220 -175 440 190"></svg>
    <h1>Creature Power <span>Rescue!</span></h1>
    <div class="hi">Hi, Lia! Baby animals need your help!</div>
    <div class="row">
      <button class="big" id="bPlay">Play!</button>
      <button class="big alt" id="bDiscs2">My Discs</button>
    </div>
  </section>

  <section class="screen" id="map">
    <h2>Pick a rescue!</h2>
    <div class="tiles" id="tiles"></div>
  </section>

  <section class="screen" id="play">
    <div class="stage" id="stage">
      <svg id="scene" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="cap" id="cap"></div>
    </div>
    <div class="choices" id="choices"></div>
  </section>

  <section class="screen" id="discs">
    <h2>My Creature Power Discs</h2>
    <div class="count" id="dcount"></div>
    <div class="dgrid" id="dgrid"></div>
  </section>

  <section class="screen" id="celebrate">
    <canvas id="confetti"></canvas>
    <h1>Hooray, Lia!</h1>
    <p>You rescued every baby animal!<br>You are a Creature Power Hero!</p>
    <div class="ring" id="ring"></div>
    <div class="row">
      <button class="big" id="bAgain">Play again!</button>
      <button class="big alt" id="bDiscs3">My Discs</button>

</div>

<div class="modal" id="modal">
  <div class="card">
    <h3 id="mTitle">Power disc!</h3>
    <svg class="disc" id="mDisc" viewBox="0 0 200 200"></svg>
    <p id="mText"></p>
    <div class="row">
      <button class="big" id="bNext">Next rescue!</button>
      <button class="big alt" id="bMap">Map</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ================= save ================= */
const KEY = "lia-creature-power-rescue-v1";
let S = {discs: [], done: [], voice: true, sound: true};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
if (!Array.isArray(S.discs)) S.discs = [];
if (!Array.isArray(S.done)) S.done = [];
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
let runId = 0;

/* ================= audio ================= */
let ac = null;
function initAudio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
  if (ac && ac.state === "suspended") ac.resume();
}
function tone(f, at, dur, type, vol, f2) {
  if (!ac || !S.sound) return;
  const t = ac.currentTime + (at || 0);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function noise(at, dur, vol, f1, f2) {
  if (!ac || !S.sound) return;
  const t = ac.currentTime + (at || 0);
  const len = Math.floor(ac.sampleRate * dur);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource(); src.buffer = buf;
  const fl = ac.createBiquadFilter(); fl.type = "bandpass"; fl.Q.value = 1.2;
  fl.frequency.setValueAtTime(f1, t); fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(fl); fl.connect(g); g.connect(ac.destination); src.start(t); src.stop(t + dur);
}
const sfx = {
  tap() { tone(700, 0, 0.08, "triangle", 0.14); },
  good() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.09, 0.22, "triangle", 0.18)); },
  oops() { tone(440, 0, 0.18, "sine", 0.16, 370); tone(370, 0.2, 0.28, "sine", 0.16, 300); },
  boing() { tone(220, 0, 0.3, "sine", 0.2, 660); },
  sparkle() { for (let i = 0; i < 10; i++) tone(900 + Math.random() * 1400, i * 0.06, 0.15, "sine", 0.08); },
  whoosh() { noise(0, 0.5, 0.25, 400, 2400); },
  pop() { tone(500, 0, 0.1, "square", 0.08, 1000); },
  hop() { tone(330, 0, 0.14, "sine", 0.12, 660); },
  splash() { noise(0, 0.3, 0.15, 1800, 500); },
  ping() { tone(1500, 0, 0.12, "sine", 0.06, 1200); },
  step() { tone(260 + Math.random() * 60, 0, 0.05, "triangle", 0.05); },
  fanfare() { [[523,0],[659,.15],[784,.3],[1047,.45],[784,.62],[1047,.75]].forEach(([f, t]) => { tone(f, t, 0.3, "triangle", 0.16); tone(f / 2, t, 0.3, "sine", 0.08); }); },
  big() { [392, 523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.12, 0.5, "triangle", 0.15)); }
};

/* ================= speech ================= */
let voice = null, lastSaid = "";
const hasTTS = "speechSynthesis" in window;
function pickVoice() {
  if (!hasTTS) return;
  const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  const pref = ["Samantha", "Google US English", "Microsoft Aria", "Microsoft Jenny", "Microsoft Zira", "Karen", "Moira", "Tessa", "Google UK English Female", "Serena", "Fiona"];
  for (const p of pref) { const v = vs.find(v => v.name.indexOf(p) >= 0); if (v) { voice = v; return; } }
  voice = vs.find(v => /female/i.test(v.name)) || vs.find(v => /en-US/i.test(v.lang)) || vs[0] || null;
}
if (hasTTS) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function caption(t) { $("cap").textContent = t; }
function say(text, opts) {
  lastSaid = text;
  if (!opts || !opts.noCap) caption(text);
  const readMs = Math.max(1300, text.length * 55);
  if (!S.voice || !hasTTS) return sleep(readMs);
  return new Promise(res => {
    let done = false; const fin = () => { if (!done) { done = true; res(); } };
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      if (voice) u.voice = voice;
      u.lang = voice ? voice.lang : "en-US";
      u.rate = 0.92; u.pitch = 1.15; u.volume = 1;
      u.onend = fin; u.onerror = fin;
      setTimeout(() => speechSynthesis.speak(u), 60);
      setTimeout(fin, text.length * 95 + 2500);
    } catch (e) { setTimeout(fin, readMs); }
  });
}
function hush() { if (hasTTS) try { speechSynthesis.cancel(); } catch (e) {} }

/* ================= art helpers ================= */
const E = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#2b2140"/><circle cx="${(x + r * .35).toFixed(1)}" cy="${(y - r * .38).toFixed(1)}" r="${(r * .4).toFixed(1)}" fill="#fff"/>`;
const blush = (x, y, r) => `<ellipse cx="${x}" cy="${y}" rx="${r || 5}" ry="${(r || 5) * .6}" fill="#ff8fb1" opacity=".55"/>`;
const mir = s => `<g transform="translate(100,0) scale(-1,1)">${s}</g>`;
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const c = k => Math.max(0, Math.min(255, ((n >> k) & 255) + amt));
  return "#" + ((1 << 24) + (c(16) << 16) + (c(8) << 8) + c(0)).toString(16).slice(1);
}

/* ---- power animal icons, 100x100 ---- */
const ICON = {
  gecko: `<path d="M60 62 C80 70 94 58 88 44 C84 36 74 40 78 47" fill="none" stroke="#3fae3a" stroke-width="8" stroke-linecap="round"/>
    <g stroke="#4cbf4a" stroke-width="6" stroke-linecap="round"><line x1="40" y1="60" x2="30" y2="76"/><line x1="58" y1="60" x2="66" y2="78"/><line x1="40" y1="46" x2="34" y2="30"/><line x1="58" y1="46" x2="68" y2="32"/></g>

async function choose(pid, btn) {
  if (busy) return;
  const run = runId;
  if (pid !== L.power) {
    misses++;
    sfx.oops();
    btn.classList.remove("wob"); void btn.offsetWidth; btn.classList.add("wob", "tried");
    wiggleKid();
    let t = `Hmm! ${POW[pid].silly}, but ${L.need}`;
    if (misses >= 2) {
      const right = $("choices").querySelector(`[data-p="${L.power}"]`);
      if (right) right.classList.add("hint");
      t += " Look for the sparkly one!";
    }
    say(t);
    return;
  }
  busy = true;
  sfx.good();
  $("choices").classList.add("gone");
  say(`Yes! ${POW[pid].name} power! Let's go!`);
  await sleep(900); if (run !== runId) return;
  await transformKid(pid, run); if (run !== runId) return;

  if (L.style === "tiny") { await scaleKidTo(.17, run); if (run !== runId) return; }
  say(`Here I come, ${L.baby}!`);
  await moveAlong(L.path, run); if (run !== runId) return;

  // pick up baby
  babyEl.style.display = "none";
  kid.carry = {type: L.critter}; renderKid();
  sfx.pop(); burst(kid.x, kid.y - 60 * kid.s, ["#ff7aa8", "#ffd84a", "#fff"], 10);
  say("Got you! Let's go home.");
  await sleep(1300); if (run !== runId) return;
  await moveAlong(L.path.slice().reverse(), run); if (run !== runId) return;
  if (L.style === "tiny") { await scaleKidTo(.85, run); if (run !== runId) return; }

  // reunion
  kid.carry = null; renderKid();
  const px = L.parentAt[0], py = L.parentAt[1];
  babyEl.style.display = "";
  babyEl.setAttribute("transform", `translate(${px + 58},${py})`);
  const q = babyEl.querySelector("text"); if (q) q.parentNode.parentNode.style.display = "none";
  babyEl.querySelector("g").setAttribute("transform", "scale(-.62,.62)");
  kid.dir = 1; placeKid();
  sfx.fanfare();
  hopEl(parentEl, `translate(${px},${py}) scale(1.1)`);
  hopEl(babyEl, `translate(${px + 58},${py})`);
  hearts(px + 30, py - 110, 9);
  burst(px + 30, py - 60, ["#ff7aa8", "#ffd84a", "#7fd0ff", "#b48cff"], 18);
  await say(`Hooray! ${L.baby} is home with ${L.parent}!`); if (run !== runId) return;
  hearts(px + 30, py - 110, 6);
  await say(`Fun fact! ${POW[L.power].fact}`); if (run !== runId) return;

  // disc
  const fresh = !S.discs.includes(L.power);
  if (fresh) S.discs.push(L.power);
  if (!S.done.includes(LI)) S.done.push(LI);
  save(); refreshTop();
  showDisc(L.power, fresh);
}

/* ---- animation helpers ---- */
function wiggleKid() {
  const t0 = performance.now(), run = runId;
  sfx.boing();
  (function f(ts) {
    if (run !== runId) return;
    const p = Math.min(1, (ts - t0) / 700);
    kid.lift = Math.sin(p * Math.PI) * 30; kid.sx = 1 - Math.sin(p * Math.PI * 4) * .12 * (1 - p);
    placeKid();
    if (p < 1) requestAnimationFrame(f); else { kid.lift = 0; kid.sx = 1; placeKid(); }
  })(t0);
}
function transformKid(pid, run) {
  return new Promise(res => {
    sfx.sparkle(); sfx.whoosh();
    const t0 = performance.now(); let switched = false;
    ring(kid.x, kid.y - 70 * kid.s, POW[pid].color);
    burst(kid.x, kid.y - 70 * kid.s, [POW[pid].color, "#ffd84a", "#fff", "#ff7aa8"], 22);
    (function f(ts) {
      if (run !== runId) return res();
      const p = Math.min(1, (ts - t0) / 1300);
      kid.sx = Math.cos(p * Math.PI * 6);
      if (Math.abs(kid.sx) < 0.001) kid.sx = 0.001;
      kid.lift = Math.sin(p * Math.PI) * 50;
      if (!switched && p > 0.42) { switched = true; kid.power = pid; renderKid(); sfx.good(); }
      placeKid();
      if (p < 1) requestAnimationFrame(f);
      else { kid.sx = 1; kid.lift = 0; placeKid(); burst(kid.x, kid.y - 70 * kid.s, [POW[pid].color, "#fff"], 12); res(); }
    })(t0);
  });
}
function scaleKidTo(target, run) {
  return new Promise(res => {
    const from = kid.s, t0 = performance.now();
    sfx.sparkle(); burst(kid.x, kid.y - 50 * kid.s, ["#ffd84a", "#fff", "#e05a4f"], 14);
    (function f(ts) {
      if (run !== runId) return res();
      const p = Math.min(1, (ts - t0) / 700);
      kid.s = from + (target - from) * (1 - Math.pow(1 - p, 3));
      placeKid();
      if (p < 1) requestAnimationFrame(f); else res();
    })(t0);
  });
}
function moveAlong(pts, run) {
  return new Promise(res => {
    const segs = []; let total = 0;
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i], len = Math.hypot(b[0] - a[0], b[1] - a[1]);
      segs.push({a, b, len, start: total}); total += len;
    }
    const style = L.style, dur = total / L.speed * 1000;
    const t0 = performance.now(); let lastFx = 0, lastSeg = -1;
    if (style === "glide" || style === "fly") sfx.whoosh();
    (function f(ts) {
      if (run !== runId) return res();
      const p = Math.min(1, (ts - t0) / dur), d = p * total;
      let k = 0; while (k < segs.length - 1 && d > segs[k].start + segs[k].len) k++;
      const sg = segs[k], u = sg.len ? Math.min(1, (d - sg.start) / sg.len) : 1;
      let x = sg.a[0] + (sg.b[0] - sg.a[0]) * u, y = sg.a[1] + (sg.b[1] - sg.a[1]) * u;
      if (Math.abs(sg.b[0] - sg.a[0]) > 2) kid.dir = sg.b[0] > sg.a[0] ? 1 : -1;
      if (style === "hop") { y -= Math.sin(Math.PI * u) * Math.min(80, sg.len * .55); if (k !== lastSeg) { sfx.hop(); lastSeg = k; } }
      if (style === "swim") { y += Math.sin(ts / 140) * 6; if (ts - lastFx > 260) { lastFx = ts; bubble(x - 30 * kid.dir, y - 10); if (Math.random() < .3) sfx.splash(); } }
      if (style === "glide" || style === "fly") y += Math.sin(ts / 180) * 5;
      if (style === "run") { y -= Math.abs(Math.sin(ts / 55)) * 8; if (ts - lastFx > 70) { lastFx = ts; dust(x - 28 * kid.dir, y); sfx.step(); } }
      if (style === "climb" || style === "tiny") { y -= Math.abs(Math.sin(ts / 90)) * 3; if (ts - lastFx > 180) { lastFx = ts; sfx.step(); } }
      if (L.echo && ts - lastFx > 520) { lastFx = ts; echoRing(x, y - 70 * kid.s); sfx.ping(); }
      kid.x = x; kid.y = y; placeKid();
      if (p < 1) requestAnimationFrame(f); else res();
    })(t0);
  });
}
function hopEl(el, base) {
  const t0 = performance.now(), run = runId;
  (function f(ts) {
    if (run !== runId) return;
    const p = Math.min(1, (ts - t0) / 1800);
    const h = Math.abs(Math.sin(p * Math.PI * 4)) * 26 * (1 - p * .5);
    el.setAttribute("transform", `translate(0,${-h.toFixed(1)}) ${base}`);
    if (p < 1) requestAnimationFrame(f); else el.setAttribute("transform", base);
  })(t0);
}

/* ---- particle fx (Web Animations on SVG) ---- */
const NS = "http://www.w3.org/2000/svg";
function fxNode(x, y, inner) {
  const g = document.createElementNS(NS, "g");
  g.setAttribute("transform", `translate(${x.toFixed(1)},${y.toFixed(1)})`);
  g.innerHTML = `<g>${inner}</g>`;
  fxEl.appendChild(g);
  return g;
}
function anim(g, frames, dur, easing, delay) {
  const el = g.firstChild;
  try {
    const a = el.animate(frames, {duration: dur, delay: delay || 0, easing: easing || "ease-out", fill: "both"});
    a.onfinish = () => g.remove();
  } catch (e) { setTimeout(() => g.remove(), dur + (delay || 0)); }
}
const STAR = c => `<path d="M0 -10 L3 -3 L10 -3 L4 2 L6 10 L0 5 L-6 10 L-4 2 L-10 -3 L-3 -3Z" fill="${c}"/>`;
function burst(x, y, colors, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, r = 50 + Math.random() * 90;
    const g = fxNode(x, y, STAR(colors[i % colors.length]));
    anim(g, [{transform: "translate(0px,0px) scale(.4) rotate(0deg)", opacity: 1},
             {transform: `translate(${Math.cos(a) * r}px,${Math.sin(a) * r}px) scale(1.3) rotate(180deg)`, opacity: 0}], 900 + Math.random() * 400);
  }
}
function ring(x, y, c) {
  const g = fxNode(x, y, `<circle r="30" fill="none" stroke="${c}" stroke-width="8"/><circle r="22" fill="#fff" opacity=".7"/>`);
  anim(g, [{transform: "scale(.3)", opacity: 1}, {transform: "scale(4)", opacity: 0}], 1000);
}
function hearts(x, y, n) {
  for (let i = 0; i < n; i++) {
    const g = fxNode(x + (Math.random() - .5) * 90, y, `<path d="M0 10 C-14 0 -14 -12 -6 -12 C-3 -12 0 -9 0 -6 C0 -9 3 -12 6 -12 C14 -12 14 0 0 10Z" fill="${["#ff7aa8", "#ff4f8a", "#ffb3cf"][i % 3]}"/>`);
    anim(g, [{transform: "translate(0px,0px) scale(.5)", opacity: 1},
      {transform: `translate(${(Math.random() - .5) * 60}px,-110px) scale(1.5)`, opacity: 0}], 1800, "ease-out", i * 120);
  }
}
function bubble(x, y) {
  const g = fxNode(x, y, `<circle r="6" fill="#fff" opacity=".8"/>`);
  anim(g, [{transform: "translate(0px,0px) scale(.6)", opacity: .9}, {transform: "translate(0px,-30px) scale(1.4)", opacity: 0}], 800);
}
function dust(x, y) {
  const g = fxNode(x, y - 4, `<circle r="9" fill="#f6e2a8"/>`);
  anim(g, [{transform: "translate(0px,0px) scale(.5)", opacity: .9}, {transform: `translate(${-kid.dir * 30}px,-12px) scale(1.6)`, opacity: 0}], 600);
}
function echoRing(x, y) {
  const g = fxNode(x, y, `<circle r="20" fill="none" stroke="#b8f0ff" stroke-width="5"/>`);
  anim(g, [{transform: "scale(.4)", opacity: 1}, {transform: "scale(6)", opacity: 0}], 1200);
}

/* ================= celebration ================= */
let confettiOn = false;
function goCelebrate() {
  show("celebrate");
  $("topTitle").textContent = "You did it!";
  $("ring").innerHTML = POW_ORDER.map((p, i) => `<svg viewBox="0 0 200 200" style="animation-delay:${i * .12}s">${discInner(p, S.discs.includes(p))}</svg>`).join("");
  sfx.big(); setTimeout(() => sfx.fanfare(), 900);
  startConfetti();
  say("Hooray, Lia! You rescued every baby animal! You are a true Creature Power hero! Tap Play again to go on more rescues.");
}
function startConfetti() {
  const cv = $("confetti"), cx = cv.getContext("2d");
  confettiOn = true;
  const parts = [];
  const cols = ["#ff7aa8", "#ffd84a", "#7fd0ff", "#3cc46a", "#b48cff", "#ff9a5a"];
  function resize() { cv.width = cv.clientWidth * (window.devicePixelRatio || 1); cv.height = cv.clientHeight * (window.devicePixelRatio || 1); }
  resize();
  for (let i = 0; i < 140; i++) parts.push({x: Math.random(), y: Math.random() - 1, v: .002 + Math.random() * .004, r: Math.random() * 6.28, vr: (Math.random() - .5) * .2, c: cols[i % cols.length], s: 6 + Math.random() * 8, w: Math.random() * 6.28});
  (function f() {
    if (!confettiOn) return;
    if (cv.width !== cv.clientWidth * (window.devicePixelRatio || 1)) resize();
    cx.clearRect(0, 0, cv.width, cv.height);
    const k = window.devicePixelRatio || 1;
    for (const p of parts) {
      p.y += p.v; p.r += p.vr; p.w += .05;
      if (p.y > 1.05) { p.y = -0.05; p.x = Math.random(); }
      cx.save(); cx.translate((p.x + Math.sin(p.w) * .02) * cv.width, p.y * cv.height); cx.rotate(p.r);
      cx.fillStyle = p.c; cx.fillRect(-p.s * k / 2, -p.s * k / 4, p.s * k, p.s * k / 2); cx.restore();
    }
    requestAnimationFrame(f);
  })();
}
function stopConfetti() { confettiOn = false; }

/* ================= boot ================= */
refreshTop();
goTitle();
// Some browsers only speak after a tap: re-say the greeting on the first tap of the title screen.
let greeted = false;
document.addEventListener("pointerup", () => {
  if (!greeted && screen === "title" && S.voice && hasTTS && !speechSynthesis.speaking) { greeted = true; say(lastSaid); }
  greeted = true;
}, {once: true});
</script>
</body>
</html>
