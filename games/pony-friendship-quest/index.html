<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffd6ec">
<title>Pony Friendship Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#5a3478; --ink2:#8a5fae; --pink:#ff6fae; --pink2:#ffb3d6; --cream:#fffaf2;
  --gold:#ffcf3f; --shadow:rgba(90,52,120,.18);
  --btn:clamp(48px, 8.5vmin, 70px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
body{font-family:Andika,"Trebuchet MS",sans-serif;color:var(--ink);
  background:linear-gradient(180deg,#bfe7ff 0%,#dff1ff 40%,#ffe6f4 75%,#fff0f7 100%)}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
svg{display:block}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- background ---------- */
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85;filter:drop-shadow(0 4px 0 rgba(160,190,230,.25));animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:160%;left:15%;bottom:20%}
.cloud::after{width:40%;height:130%;right:12%;bottom:15%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
#hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:30vh}

/* ---------- top bar ---------- */
#topbar{position:relative;z-index:5;display:flex;align-items:center;gap:clamp(6px,1.4vmin,12px);padding:clamp(6px,1.2vmin,12px) clamp(8px,2vmin,18px)}
#topbar .spacer{flex:1}
.iconbtn{width:var(--btn);height:var(--btn);border-radius:50%;border:none;background:#fff;
  box-shadow:0 5px 0 var(--shadow);display:grid;place-items:center;position:relative;flex:none;transition:transform .12s}
.iconbtn svg{width:58%;height:58%}
.iconbtn:active,.hearbtn:active,.bigbtn:active{transform:translateY(3px) scale(.97)}
.iconbtn.off{background:#eee8f2}
.iconbtn.off::after{content:"";position:absolute;width:72%;height:6px;border-radius:3px;background:#ff5a7a;transform:rotate(-45deg);box-shadow:0 0 0 2px #fff}
.hearbtn{height:var(--btn);border:none;border-radius:999px;background:linear-gradient(180deg,#ffe57a,#ffc93f);
  box-shadow:0 5px 0 #e0a21a;display:flex;align-items:center;gap:8px;padding:0 clamp(12px,2.4vmin,22px) 0 clamp(8px,1.6vmin,14px);
  font-family:Grandstander,Andika,sans-serif;font-weight:800;font-size:clamp(15px,2.6vmin,24px);color:#7a4300;transition:transform .12s}
.hearbtn svg{width:calc(var(--btn) * .6);height:calc(var(--btn) * .6)}
.hearbtn.talking svg .wave{animation:wave .6s ease-in-out infinite alternate}
@keyframes wave{from{opacity:.25}to{opacity:1}}
@media (max-width:520px){ .hearbtn span{display:none} .hearbtn{padding:0 10px} }

/* ---------- screens ---------- */
#main{position:relative;z-index:2;flex:1;min-height:0}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:4px clamp(10px,2.5vmin,24px) clamp(10px,2.5vmin,24px);gap:clamp(6px,1.6vmin,16px)}
.screen.active{display:flex;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}

h1,h2,.title-font{font-family:Grandstander,Andika,sans-serif;font-weight:800;margin:0}
.bigbtn{border:none;border-radius:999px;padding:clamp(12px,2.2vmin,20px) clamp(26px,5vmin,48px);
  font-family:Grandstander,Andika,sans-serif;font-weight:800;font-size:clamp(22px,4.2vmin,40px);color:#fff;
  background:linear-gradient(180deg,#ff8cc4,#ff5aa0);box-shadow:0 7px 0 #d93a80,0 10px 24px rgba(255,90,160,.35);
  display:inline-flex;align-items:center;gap:12px;transition:transform .12s;letter-spacing:.5px}
.bigbtn.purple{background:linear-gradient(180deg,#b896ff,#8f63f0);box-shadow:0 7px 0 #6a3fcb,0 10px 24px rgba(143,99,240,.3)}
.bigbtn.blue{background:linear-gradient(180deg,#7fcbff,#3fa2f0);box-shadow:0 7px 0 #2178c4,0 10px 24px rgba(63,162,240,.3)}
.bigbtn.green{background:linear-gradient(180deg,#7fe3a6,#38c172);box-shadow:0 7px 0 #22955a,0 10px 24px rgba(56,193,114,.3)}
.bigbtn svg{width:1.2em;height:1.2em}
.btnrow{display:flex;gap:clamp(10px,2.5vmin,24px);flex-wrap:wrap;justify-content:center}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

.bubble{background:#fff;border-radius:28px;padding:clamp(10px,2vmin,18px) clamp(14px,2.6vmin,26px);
  box-shadow:0 6px 0 var(--shadow);font-size:clamp(18px,3.3vmin,34px);font-weight:700;line-height:1.25;position:relative;text-align:center}
.bubble.tail-left::before{content:"";position:absolute;left:-14px;top:50%;margin-top:-12px;border:12px solid transparent;border-right:16px solid #fff;border-left:0}

/* pony + faded magic */
.pony svg{width:100%;height:100%;overflow:visible}
.pony{transition:filter 1.6s ease}
.faded{filter:grayscale(1) brightness(1.08) contrast(.82)}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4%)}}
.hop{animation:hop .7s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-18%) rotate(-3deg)}60%{transform:translateY(-18%) rotate(3deg)}}
.bounce{animation:bounce .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.wiggle{animation:wiggle .5s ease}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
.hintglow{animation:glow 1s ease-in-out infinite!important}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 6px #ffd23f) drop-shadow(0 0 2px #fff);transform:scale(1)}50%{filter:drop-shadow(0 0 22px #ffcf3f) drop-shadow(0 0 6px #fff);transform:scale(1.1)}}

/* ---------- title ---------- */
#s-title{gap:clamp(8px,2vmin,20px)}
.title-rainbow{width:min(80vw,620px);height:auto;max-height:28vh}
.game-title{font-size:clamp(34px,8vmin,86px);line-height:1;text-align:center;
  background:linear-gradient(90deg,#ff5a5f,#ff9f1c,#f5c200,#3cc46f,#3d97f0,#9a5cf5);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #fff) drop-shadow(0 6px 10px rgba(90,52,120,.2))}
.title-sub{font-size:clamp(17px,3vmin,28px);font-weight:700;text-align:center;max-width:720px}
.title-ponies{display:flex;gap:2vmin;align-items:flex-end;height:min(24vh,30vw)}
.title-ponies .pony{height:100%;aspect-ratio:1}

/* ---------- map ---------- */
.rainbow-wrap{width:min(92vw,560px);height:clamp(64px,19vh,180px);flex:none}
.rainbow-wrap svg{width:100%;height:100%}
.maphint{font-size:clamp(18px,3.2vmin,30px);font-weight:700;background:rgba(255,255,255,.85);padding:6px 20px;border-radius:999px;box-shadow:0 4px 0 var(--shadow)}
#ponyGrid{flex:1;min-height:0;width:100%;max-width:1100px;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:clamp(8px,2vmin,20px)}
@media (max-aspect-ratio:4/5){ #ponyGrid{grid-template-columns:repeat(2,1fr)} }
@media (min-aspect-ratio:21/9){ #ponyGrid{grid-template-columns:repeat(6,1fr)} }
.ponycard{border:none;border-radius:26px;background:rgba(255,255,255,.72);box-shadow:0 6px 0 var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;min-height:0;min-width:0;position:relative;transition:transform .15s}
.ponycard:active{transform:scale(.96)}
.ponycard .pony{flex:1;min-height:0;width:100%}
.ponycard .name{font-family:Grandstander,Andika,sans-serif;font-weight:800;font-size:clamp(14px,2.6vmin,24px);white-space:nowrap}
.ponycard.done{background:rgba(255,255,255,.95)}
.ponycard .badge{position:absolute;top:6px;right:6px;width:clamp(32px,6.5vmin,56px);height:clamp(32px,6.5vmin,56px)}
.ponycard .needs{position:absolute;top:8px;right:10px;font-family:Grandstander;font-weight:800;color:#fff;background:#ff6fae;border-radius:999px;padding:2px 10px;font-size:clamp(12px,2vmin,18px);box-shadow:0 3px 0 #d93a80}

/* ---------- intro ---------- */
.bigpony{height:min(46vh,70vw);aspect-ratio:1}
#introBubble{max-width:760px}

/* ---------- play ---------- */
#s-play{justify-content:flex-start}
.playhead{display:flex;align-items:center;gap:clamp(10px,2.4vmin,24px);width:100%;max-width:1000px;height:clamp(84px,21vh,190px);flex:none}
.playhead .pony{height:100%;aspect-ratio:1;flex:none}
.playhead .bubble{flex:1}
#progress{display:flex;gap:10px;flex:none}
#progress svg{width:clamp(26px,4.6vmin,42px);height:clamp(26px,4.6vmin,42px);transition:transform .3s}
#progress .on svg{animation:bounce .6s}
#area{flex:1;min-height:0;width:100%;max-width:1100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2.4vmin,24px);position:relative}

/* balloons */
.swatch{width:clamp(70px,14vmin,130px);height:clamp(70px,14vmin,130px);background:#fff;border-radius:50%;box-shadow:0 6px 0 var(--shadow);padding:12%;flex:none}
.swatch svg,.pitem svg,.pslot svg{width:100%;height:100%}
.balloons{display:flex;gap:clamp(8px,3vmin,40px);justify-content:center;align-items:flex-end;flex:1;min-height:0;width:100%}
.balloon{border:none;background:none;padding:0;height:min(38vh,48vw,300px);aspect-ratio:100/150;max-height:100%}
.balloon:nth-child(odd) svg{animation:floaty 3s ease-in-out infinite}
.balloon:nth-child(even) svg{animation:floaty 3.4s ease-in-out infinite reverse}
.balloon svg{width:100%;height:100%}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6%) rotate(2deg)}}
.balloon.away{animation:away 1.4s ease-in forwards}
@keyframes away{to{transform:translateY(-80vh) rotate(8deg);opacity:0}}

/* pattern */
.prow{display:flex;gap:clamp(4px,1.4vmin,14px);background:rgba(255,255,255,.8);padding:clamp(8px,2vmin,18px);border-radius:28px;box-shadow:0 6px 0 var(--shadow)}
.pitem,.pslot{width:min(12.5vw,13vh,110px);height:min(12.5vw,13vh,110px);flex:none}
.pitem{animation:popIn .4s cubic-bezier(.3,1.6,.5,1) backwards}
.pslot{border:5px dashed #d9b8ef;border-radius:22px;display:grid;place-items:center;font-family:Grandstander;font-weight:800;font-size:min(8vw,8vh,64px);color:#c49ae6}
.pslot.filled{border-color:transparent}
@keyframes popIn{from{transform:scale(0)}to{transform:scale(1)}}
.pchoices{display:flex;gap:clamp(12px,4vmin,40px)}
.pchoice{border:none;background:#fff;border-radius:28px;box-shadow:0 6px 0 var(--shadow);width:min(22vw,20vh,160px);height:min(22vw,20vh,160px);padding:min(2.6vw,2.4vh,19px);display:grid}
.pchoice svg{width:100%;height:100%}

/* sharing */
.pile{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(4px,1vmin,10px);background:rgba(255,255,255,.75);border-radius:28px;padding:clamp(8px,1.6vmin,14px) clamp(12px,2vmin,20px);box-shadow:0 6px 0 var(--shadow);min-height:calc(min(10vw,9vh,74px) + 28px);max-width:96%}
.pileitem{width:min(10vw,9vh,74px);height:min(10vw,9vh,74px);touch-action:none;cursor:grab;flex:none}
.pileitem svg,.ghost svg,.flyer svg,.plateitem svg{width:100%;height:100%}
.pile .empty{font-size:clamp(16px,2.6vmin,24px);font-weight:700;align-self:center;color:var(--ink2)}
.friends{display:flex;gap:clamp(8px,2.4vmin,28px);justify-content:center;flex:1;min-height:0;width:100%;align-items:stretch}
.friend{border:none;background:rgba(255,255,255,.9);border-radius:28px;box-shadow:0 6px 0 var(--shadow);width:min(30vw,260px);display:flex;flex-direction:column;align-items:center;padding:8px;min-height:0;position:relative}
.friend .fhead{height:38%;min-height:0;aspect-ratio:1}
.friend .fhead svg{width:100%;height:100%}
.plate{flex:1;width:100%;min-height:0;border-radius:50%/40%;background:radial-gradient(ellipse at 50% 40%,#fff 0 55%,#f4e6ff 56% 70%,#e6d0f7 71%);display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px;padding:6% 10%}
.plateitem{width:min(7vw,6.5vh,50px);height:min(7vw,6.5vh,50px);animation:popIn .35s cubic-bezier(.3,1.6,.5,1)}
.count{position:absolute;top:-10px;right:-8px;min-width:clamp(40px,7vmin,64px);height:clamp(40px,7vmin,64px);border-radius:999px;background:#ff6fae;color:#fff;font-family:Grandstander;font-weight:800;font-size:clamp(24px,4.4vmin,40px);display:grid;place-items:center;box-shadow:0 4px 0 #d93a80;border:4px solid #fff}
.count.full{background:#38c172;box-shadow:0 4px 0 #22955a}
.ghost,.flyer{position:fixed;z-index:60;pointer-events:none;width:70px;height:70px;margin:-35px 0 0 -35px}
.flyer{transition:transform .45s cubic-bezier(.4,0,.3,1)}

/* memory */
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,3vmin,34px);align-items:center;justify-items:center}
@media (max-aspect-ratio:3/4){ .pads{grid-template-columns:repeat(2,1fr)} .pad{width:min(36vw,22vh)!important;height:min(36vw,22vh)!important} }
.pad{border:none;background:rgba(255,255,255,.85);border-radius:50%;box-shadow:0 7px 0 var(--shadow);width:min(20vw,36vh,200px);height:min(20vw,36vh,200px);padding:min(2vw,3.6vh,20px);display:grid;transition:transform .15s,background .2s,filter .2s}
.pad svg{width:100%;height:100%;filter:saturate(.75);transition:filter .2s}
.pad.lit{transform:scale(1.14);background:#fff8c8;box-shadow:0 0 0 8px #fff,0 0 40px 12px rgba(255,214,70,.9)}
.pad.lit svg{filter:saturate(1.3) brightness(1.1)}
.pad.bell.lit svg{animation:ring .5s ease}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.watchtag{font-family:Grandstander;font-weight:800;font-size:clamp(18px,3.2vmin,30px);padding:6px 20px;border-radius:999px;background:#fff;box-shadow:0 4px 0 var(--shadow)}
.watchtag.your{background:#ffe57a;color:#7a4300;animation:pulse 1.2s ease-in-out infinite}

/* ---------- reward ---------- */
#s-reward h2{font-size:clamp(24px,5vmin,52px);text-align:center;color:var(--ink)}
.reward-row{display:flex;align-items:center;justify-content:center;gap:clamp(10px,4vmin,50px);flex:1;min-height:0;width:100%}
.reward-row .bigpony{height:min(40vh,46vw);max-height:100%}
.sticker{width:min(26vh,30vw);aspect-ratio:1;border-radius:50%;background:#fff;border:clamp(5px,1vmin,10px) solid #fff;box-shadow:0 8px 0 var(--shadow),0 0 0 4px rgba(255,255,255,.6);display:grid;place-items:center;position:relative}
.sticker .inner{width:100%;height:100%;border-radius:50%;display:grid;place-items:center}
.sticker .inner svg{width:68%;height:68%}
.sticker.pop{animation:stickerPop .9s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes stickerPop{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(-6deg)}}
.cheer{display:flex;gap:1vmin;height:clamp(40px,10vh,100px);flex:none}
.cheer .pony{height:100%;aspect-ratio:1}

/* ---------- book ---------- */
#s-book h2{font-size:clamp(28px,5.5vmin,56px)}
.bookpage{flex:1;min-height:0;width:100%;max-width:980px;background:#fffaf0;border-radius:30px;box-shadow:0 8px 0 var(--shadow),inset 0 0 0 10px #ffe1ef;
  display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:clamp(6px,2vmin,20px);padding:clamp(14px,3vmin,30px)}
@media (max-aspect-ratio:4/5){ .bookpage{grid-template-columns:repeat(2,1fr)} }
.slot{border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;gap:4px;padding:0}
.slot .sticker{width:auto;height:min(100%,24vw);max-height:calc(100% - 2em);flex:1 1 auto;min-height:0}
.slot:nth-child(odd) .sticker{transform:rotate(-6deg)}
.slot:nth-child(even) .sticker{transform:rotate(5deg)}
.slot .lbl{font-family:Grandstander;font-weight:800;font-size:clamp(13px,2.4vmin,22px);white-space:nowrap}
.slot.locked .sticker{background:transparent;border:5px dashed #e3c9f2;box-shadow:none}
.slot.locked .inner svg{opacity:.13;filter:grayscale(1)}
.slot.locked .lbl{color:#c7a9dd}
.rainbows{font-size:clamp(16px,2.8vmin,26px);font-weight:700;display:flex;align-items:center;gap:8px}
.rainbows svg{height:1.6em;width:auto}

/* ---------- party ---------- */
#s-party h1{font-size:clamp(30px,6.5vmin,70px);text-align:center;background:linear-gradient(90deg,#ff5a5f,#ff9f1c,#f5c200,#3cc46f,#3d97f0,#9a5cf5);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #fff)}
.party-rainbow{width:min(94vw,760px);height:clamp(90px,28vh,330px);flex:none}
.party-rainbow svg{width:100%;height:100%}
.party-ponies{display:flex;justify-content:center;gap:1vmin;height:min(22vh,15vw);flex:none}
.party-ponies .pony{height:100%;aspect-ratio:1}

/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.spark{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;animation:spark .9s ease-out forwards}
@keyframes spark{0%{transform:translate(0,0) scale(.4) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(200deg);opacity:0}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:45}

@media (max-height:520px){
  .playhead{height:clamp(70px,18vh,120px)}
  .bubble{font-size:clamp(16px,3.6vmin,26px);padding:8px 14px}
  .bigbtn{font-size:clamp(18px,4.6vmin,30px);padding:10px 24px}
  .cheer{display:none}
}
@media (prefers-reduced-motion:reduce){ .cloud{animation:none} }
</style>
</head>
<body>
<div id="app">
  <div id="sky">
    <div class="cloud" style="top:9%;width:150px;height:44px;animation-duration:70s;animation-delay:-20s"></div>
    <div class="cloud" style="top:22%;width:110px;height:34px;animation-duration:90s;animation-delay:-60s"></div>
    <div class="cloud" style="top:4%;width:90px;height:28px;animation-duration:110s;animation-delay:-5s"></div>
    <svg id="hills" viewBox="0 0 1000 300" preserveAspectRatio="none">
      <path d="M0 140 C200 60 380 80 520 140 C680 200 820 90 1000 110 L1000 300 L0 300Z" fill="#c9f0c4"/>
      <path d="M0 210 C160 150 320 160 470 200 C640 250 800 170 1000 190 L1000 300 L0 300Z" fill="#a8e3a6"/>
      <g fill="#fff"><circle cx="120" cy="230" r="6"/><circle cx="310" cy="250" r="5"/><circle cx="640" cy="260" r="6"/><circle cx="880" cy="235" r="5"/></g>
      <g fill="#ff9fcb"><circle cx="120" cy="230" r="2.5"/><circle cx="310" cy="250" r="2"/><circle cx="640" cy="260" r="2.5"/><circle cx="880" cy="235" r="2"/></g>
    </svg>
  </div>

  <header id="topbar">
    <button class="iconbtn" id="btnHome" aria-label="Pony map">
      <svg viewBox="0 0 48 48"><path d="M8 24 L24 9 L40 24" fill="none" stroke="#ff6fae" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 22 V39 H35 V22" fill="#ffd1e6" stroke="#ff6fae" stroke-width="4" stroke-linejoin="round"/><path d="M24 36 C17 31 18 25 21 25 C23 25 24 27 24 27 C24 27 25 25 27 25 C30 25 31 31 24 36Z" fill="#ff6fae"/></svg>
    </button>
    <div class="spacer"></div>
    <button class="hearbtn" id="btnHear" aria-label="Hear it again">
      <svg viewBox="0 0 48 48"><path d="M8 18 H16 L27 9 V39 L16 30 H8Z" fill="#7a4300"/><path class="wave" d="M32 17 C36 21 36 27 32 31" fill="none" stroke="#7a4300" stroke-width="4" stroke-linecap="round"/><path class="wave" d="M37 12 C44 19 44 29 37 36" fill="none" stroke="#7a4300" stroke-width="4" stroke-linecap="round"/></svg>

var confetti = {run:false, parts:[], raf:0};
function startConfetti(sec){
  var cv = $('#confetti'), ctx = cv.getContext('2d');
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  var cols = STRIPES.concat(['#FF7EC0','#fff']);
  var until = sec ? performance.now() + sec*1000 : Infinity;
  confetti.run = true;
  function add(){ confetti.parts.push({x:Math.random()*innerWidth, y:-20, vx:(Math.random()-.5)*1.5, vy:1.5+Math.random()*2.5, r:Math.random()*6.3, vr:(Math.random()-.5)*.2, s:6+Math.random()*8, c:rand(cols), k:Math.random()<.35?1:0}); }
  cancelAnimationFrame(confetti.raf);
  (function loop(t){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    if (confetti.run && performance.now() < until && confetti.parts.length < 160) { add(); add(); }
    confetti.parts = confetti.parts.filter(function(p){ return p.y < innerHeight + 30; });
    confetti.parts.forEach(function(p){
      p.x += p.vx + Math.sin(p.y/40); p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if (p.k) { ctx.beginPath(); ctx.arc(0,0,p.s/2,0,7); ctx.fill(); } else ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
      ctx.restore();
    });
    if (confetti.parts.length || (confetti.run && performance.now() < until)) confetti.raf = requestAnimationFrame(loop);
    else { confetti.run = false; ctx.clearRect(0,0,innerWidth,innerHeight); }
  })();
}
function stopConfetti(){ confetti.run = false; confetti.parts = []; cancelAnimationFrame(confetti.raf); var cv = $('#confetti'); cv.getContext('2d').clearRect(0,0,cv.width,cv.height); }

var ACTS = {

/* ---- 1. color matching ---- */
function actColor(r){
  var p = cur.pony, area = $('#area');
  var yellow = COLORS[2], target, n, text, swatch = false;
  if (r === 0) { target = yellow; n = 3; text = first(p) + ' loves yellow. Tap the yellow balloon!'; }
  else if (r === 1) { target = rand(COLORS.filter(function(c){ return c !== yellow; })); n = 4; swatch = true; text = 'Find the balloon that matches the heart!'; }
  else { target = rand(COLORS.filter(function(c){ return c !== yellow; })); n = 4; text = 'Tap the ' + target.n + ' balloon!'; }
  var others = shuffle(COLORS.filter(function(c){ return c !== target; })).slice(0, n-1);
  var opts = shuffle(others.concat([target]));
  if (swatch) { var sw = document.createElement('div'); sw.className = 'swatch bob'; sw.innerHTML = svgBox(shapeSVG('heart', target.c)); area.appendChild(sw); }
  var row = document.createElement('div'); row.className = 'balloons'; area.appendChild(row);
  var correctEl = null;
  opts.forEach(function(c){
    var b = document.createElement('button'); b.className = 'balloon'; b.setAttribute('aria-label', c.n + ' balloon');
    b.innerHTML = balloonSVG(c.c);
    if (c === target) correctEl = b;
    b.addEventListener('click', function(){
      if (cur.busy) return;
      if (c === target) { b.classList.remove('hintglow'); roundWon(b); setTimeout(function(){ b.classList.add('away'); }, 250); }
      else {
        var h = swatch ? 'That one is ' + c.n + '. The heart is ' + target.n + '. Try again!' : 'That one is ' + c.n + '. Find ' + target.n + '!';
        miss(b, h, function(){ correctEl.classList.add('hintglow'); });
      }
    });
    row.appendChild(b);
  });

}

/* ---- 2. patterns ---- */
var PATTERNS = [
  {unit:[{sh:'heart',c:'#FF7EC0',n:'heart'},{sh:'star',c:'#FFC93D',n:'star'}], extra:{sh:'flower',c:'#A267FF',n:'flower'}},
  {unit:[{sh:'heart',c:'#FF4D5A',n:'red heart'},{sh:'heart',c:'#3D9BFF',n:'blue heart'}], extra:{sh:'heart',c:'#3FCB74',n:'green heart'}},
  {unit:[{sh:'star',c:'#FFC93D',n:'star'},{sh:'heart',c:'#FF7EC0',n:'heart'},{sh:'flower',c:'#A267FF',n:'flower'}], extra:{sh:'star',c:'#3D9BFF',n:'blue star'}}
];
function actPattern(r){
  var P = PATTERNS[r], area = $('#area'), shown = 5;
  var seq = []; for (var i=0;i<shown;i++) seq.push(P.unit[i % P.unit.length]);
  var answer = P.unit[shown % P.unit.length];
  var row = document.createElement('div'); row.className = 'prow';
  seq.forEach(function(it, i){ var d = document.createElement('div'); d.className = 'pitem'; d.style.animationDelay = (i*0.12)+'s'; d.innerHTML = svgBox(shapeSVG(it.sh, it.c)); row.appendChild(d); });
  var slot = document.createElement('div'); slot.className = 'pslot'; slot.textContent = '?'; row.appendChild(slot);
  area.appendChild(row);
  var ch = document.createElement('div'); ch.className = 'pchoices'; area.appendChild(ch);
  var choices = shuffle(P.unit.slice(0, Math.min(P.unit.length, 3)).concat(P.unit.length < 3 ? [P.extra] : []));
  var correctEl = null;
  var spokenSeq = seq.map(function(s){ return s.n; }).join(', ');
  choices.forEach(function(it){
    var b = document.createElement('button'); b.className = 'pchoice'; b.setAttribute('aria-label', it.n);
    b.innerHTML = svgBox(shapeSVG(it.sh, it.c));
    if (it === answer) correctEl = b;
    b.addEventListener('click', function(){
      if (cur.busy) return;
      if (it === answer) {
        b.classList.remove('hintglow');
        slot.classList.add('filled'); slot.textContent = ''; slot.innerHTML = svgBox(shapeSVG(it.sh, it.c));
        row.querySelectorAll('.pitem,.pslot').forEach(function(e, i){ setTimeout(function(){ retrigger(e, 'bounce'); }, i*90); });
        roundWon(slot, 'Yes! ' + spokenSeq + ', ' + answer.n + '! You finished the pattern!');
      } else {
        miss(b, 'Say it with me. ' + seq.slice(0, P.unit.length*2).map(function(s){ return s.n; }).join(', ') + '. Try again!', function(){ correctEl.classList.add('hintglow'); });
      }
    });
    ch.appendChild(b);
  });
  ask('What comes next? Tap the one that finishes the pattern.', spokenSeq + '. What comes next?');
}

/* ---- 3 & 5. sharing by counting ---- */
var SHARE = {
  each: [{friends:2, per:2}, {friends:3, per:2}, {friends:2, per:3}],
  fair: [{friends:2, total:4}, {friends:2, total:6}, {friends:3, total:6}]
};
function actShare(r, mode){
  var cfg = SHARE[mode][r], p = cur.pony, area = $('#area');
  var nf = cfg.friends, per = mode === 'each' ? cfg.per : cfg.total / nf, total = nf * per;
  var itemName = mode === 'each' ? 'apple' : 'cupcake', itemsName = itemName + 's';
  var itemSVG = mode === 'each' ? appleSVG : cupcakeSVG;
  var counts = []; for (var i=0;i<nf;i++) counts.push(0);
  var friendsList = PONIES.filter(function(q){ return q !== p; });
  var pile = document.createElement('div'); pile.className = 'pile'; area.appendChild(pile);
  var fr = document.createElement('div'); fr.className = 'friends'; area.appendChild(fr);
  var friendEls = [];
  for (var k=0;k<total;k++) addPileItem();
  function addPileItem(){
    var it = document.createElement('div'); it.className = 'pileitem'; it.innerHTML = itemSVG();
    it.addEventListener('pointerdown', startDrag);
    pile.appendChild(it);
    var e = pile.querySelector('.empty'); if (e) e.remove();
  }
  for (var f=0; f<nf; f++){
    (function(fi){
      var q = friendsList[(fi + r) % friendsList.length];
      var b = document.createElement('button'); b.className = 'friend'; b.dataset.i = fi; b.setAttribute('aria-label', 'Give to ' + q.name);
      b.innerHTML = '<div class="fhead pony bob" style="animation-delay:'+(-fi*0.5)+'s">'+ponySVG(q, {head:true})+'</div><div class="plate"></div><div class="count">0</div>';
      b.addEventListener('click', function(e){
        if (e.target.closest('.plateitem')) return;
        give(fi, null);
      });
      fr.appendChild(b); friendEls.push(b);
    })(f);
  }
  function needy(){ for (var i=0;i<nf;i++) if (counts[i] < per) return friendEls[i]; return null; }
  function updateCount(fi){
    var c = friendEls[fi].querySelector('.count');
    c.textContent = counts[fi];
    c.classList.toggle('full', counts[fi] >= per);
    retrigger(c, 'bounce');
  }
  function give(fi, fromEl){
    if (cur.busy) return;
    var fe = friendEls[fi];
    if (counts[fi] >= per) {
      var msg = mode === 'each' ? 'Oh! This friend has ' + per + ' already. Give one to another friend.' : 'Oh! This friend has enough. Share with another friend.';
      miss(fe, msg, function(){ var n = needy(); if (n) n.classList.add('hintglow'); }, true);
      return;
    }
    var item = fromEl || pile.querySelector('.pileitem:last-child');
    if (!item) return;
    friendEls.forEach(function(x){ x.classList.remove('hintglow'); });
    counts[fi]++;
    var start = centerOf(item);
    item.remove();
    if (!pile.querySelector('.pileitem')) pile.innerHTML = '<div class="empty">All shared!</div>';
    var plate = fe.querySelector('.plate');
    var pi = document.createElement('div'); pi.className = 'plateitem'; pi.innerHTML = itemSVG(); pi.style.visibility = 'hidden';
    pi.addEventListener('click', function(ev){ ev.stopPropagation(); takeBack(fi, pi); });
    plate.appendChild(pi);
    if (!fromEl) {
      var fl = document.createElement('div'); fl.className = 'flyer'; fl.innerHTML = itemSVG();
      fl.style.left = start.x + 'px'; fl.style.top = start.y + 'px';
      document.body.appendChild(fl);
      var end = centerOf(pi);
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ fl.style.transform = 'translate('+(end.x-start.x)+'px,'+(end.y-start.y)+'px) scale(.7)'; }); });
      setTimeout(function(){ fl.remove(); pi.style.visibility = ''; }, 460);
    } else pi.style.visibility = '';
    sfx.pop(counts[fi]);
    updateCount(fi);
    retrigger(fe.querySelector('.fhead'), 'bounce');
    say(String(counts[fi]));
    if (counts.every(function(c){ return c === per; })) {
      cur.busy = true;
      setTimeout(function(){
        var t = mode === 'each' ? 'Each friend has ' + per + ' ' + itemsName + '. You did it!' : 'Each friend has ' + per + '. That is fair! Great sharing!';
        roundWon(fr, t);
      }, 700);
    }
  }
  function takeBack(fi, pi){
    if (cur.busy) return;
    counts[fi]--; pi.remove(); addPileItem(); sfx.tap(); updateCount(fi);
    say('Back to the basket. ' + (counts[fi]) + '.');
  }
  // drag support
  function startDrag(e){
    if (cur.busy) return;
    e.preventDefault();
    var it = e.currentTarget, sx = e.clientX, sy = e.clientY, moved = false;
    var g = document.createElement('div'); g.className = 'ghost'; g.innerHTML = itemSVG();
    g.style.left = sx + 'px'; g.style.top = sy + 'px';
    document.body.appendChild(g); it.style.opacity = '.3';
    sfx.tap();
    function mv(ev){ if (Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy) > 8) moved = true; g.style.left = ev.clientX + 'px'; g.style.top = ev.clientY + 'px'; }
    function up(ev){
      window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
      g.remove(); it.style.opacity = '';
      var t = document.elementFromPoint(ev.clientX, ev.clientY);
      var fe = t && t.closest ? t.closest('.friend') : null;
      if (fe && fr.contains(fe)) give(+fe.dataset.i, it);
      else if (!moved) { var tip = 'Tap a friend to give ' + (mode === 'each' ? 'an apple' : 'a cupcake') + '!'; setBubble(tip); say(tip); friendEls.forEach(function(x){ retrigger(x, 'bounce'); }); }
    }
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  }
  var text = mode === 'each'
    ? 'Give each friend ' + per + ' apples. Tap a friend to give one.'
    : 'Share ' + total + ' cupcakes fairly. Every friend gets the same.';
  ask(text, mode === 'each' ? text : text + ' Tap a friend to give one.');
}

/* ---- 4 & 6. remember the song ---- */
var MEM = {
  flower: {lens:[2,3,3], notes:[523.25,659.25,783.99,1046.5], colors:['#FF7EC0','#FFC93D','#3D9BFF','#A267FF'], names:['pink','yellow','blue','purple'], word:'flowers'},
  bell:   {lens:[2,3,4], notes:[587.33,698.46,880,1174.66], colors:['#FF4D5A','#FF9A1F','#3FCB74','#3D9BFF'], names:['red','orange','green','blue'], word:'bells'}
};
function actMemory(r, kind){
  var M = MEM[kind], area = $('#area'), n = M.lens[r];
  var seq = [];
  while (seq.length < n) { var x = Math.floor(Math.random()*4); if (x !== seq[seq.length-1]) seq.push(x); }
  var tag = document.createElement('div'); tag.className = 'watchtag'; tag.textContent = 'Watch and listen'; area.appendChild(tag);
  var grid = document.createElement('div'); grid.className = 'pads'; area.appendChild(grid);
  var pads = [];
  M.colors.forEach(function(c, i){
    var b = document.createElement('button'); b.className = 'pad ' + kind; b.setAttribute('aria-label', M.names[i] + ' ' + kind);
    b.innerHTML = kind === 'flower' ? flowerPadSVG(c) : bellSVG(c);
    b.addEventListener('pointerdown', function(e){ e.preventDefault(); tapPad(i); });
    grid.appendChild(b); pads.push(b);
  });
  var listening = false, step = 0;
  function light(i, ms){
    var p = pads[i]; p.classList.add('lit');
    if (kind === 'flower') sfx.note(M.notes[i]); else sfx.bell(M.notes[i]);
    setTimeout(function(){ p.classList.remove('lit'); }, ms || 450);
  }
  function clearGlow(){ pads.forEach(function(p){ p.classList.remove('hintglow'); }); }
  function glowNext(){ clearGlow(); if (cur.misses >= 2 && listening) pads[seq[step]].classList.add('hintglow'); }
  async function play(intro){
    var f = flow; listening = false; step = 0; clearGlow();
    tag.className = 'watchtag'; tag.textContent = 'Watch and listen';
    if (intro) { await ask(intro); if (f !== flow) return; }
    await wait(350);
    for (var i=0;i<seq.length;i++){ if (f !== flow) return; light(seq[i], 480); await wait(800); }
    if (f !== flow) return;
    tag.className = 'watchtag your'; tag.textContent = 'Your turn!';
    listening = true;
    glowNext();
    ask('Your turn! Tap the ' + M.word + ' in the same order.');
  }
  async function tapPad(i){
    if (cur.busy || !listening) return;
    light(i, 300);
    if (i === seq[step]) {
      step++;
      retrigger(pads[i], 'bounce');
      if (step >= seq.length) { listening = false; clearGlow(); tag.textContent = 'Yay!'; roundWon(pads[i], 'You remembered the song! Great job!'); }
      else glowNext();
    } else {
      listening = false; clearGlow();
      cur.misses++;
      retrigger(pads[i], 'wiggle');
      sfx.soft();
      var f = flow;
      await wait(400);
      if (f !== flow) return;
      play(rand(GENTLE) + ' Let’s watch and listen again.');
    }
  }
  var intro = n === 2 ? 'Watch and listen! The ' + M.word + ' will sing. Then you copy them.' : 'Now ' + n + ' notes! Watch and listen.';
  play(intro);
}

/* ================= reward ================= */
function ponyHelped(){
  var p = cur.pony, isNew = state.helped.indexOf(p.id) < 0, newSticker = state.stickers.indexOf(p.id) < 0;
  if (isNew) state.helped.push(p.id);
  if (newSticker) state.stickers.push(p.id);
  save();
  show('reward');
  var f = flow;
  $('#rewardRainbow').innerHTML = rainbowSVG(stripesOn(), isNew ? p.stripe : -1);
  var rp = $('#rewardPony'); rp.innerHTML = ponySVG(p); rp.className = 'pony bigpony' + (isNew ? ' faded' : '');
  var st = $('#rewardSticker'); st.className = 'sticker'; st.style.visibility = 'hidden';
  st.innerHTML = '<div class="inner" style="background:'+p.body+'">'+svgBox(markSVG(p.mark))+'</div>';
  $('#rewardTitle').textContent = 'Hooray! ' + p.name + ' shines again!';
  var others = PONIES.filter(function(q){ return q !== p && state.helped.indexOf(q.id) >= 0; });
  $('#cheerRow').innerHTML = others.map(function(q, i){ return '<div class="pony hop" style="animation-delay:'+(i*0.12)+'s">'+ponySVG(q)+'</div>'; }).join('');
  var all = state.helped.length >= PONIES.length;
  var btns = $('#rewardBtns'); btns.innerHTML = '';
  if (all) btns.appendChild(mkBtn('Big celebration!', 'green pulse', goParty));
  else btns.appendChild(mkBtn('Next pony', 'pulse', function(){ var nx = PONIES.filter(function(q){ return state.helped.indexOf(q.id) < 0; })[0]; goIntro(nx); }));
  btns.appendChild(mkBtn('Sticker book', 'purple', function(){ openBook('map'); }));
  setTimeout(function(){
    if (f !== flow) return;
    rp.classList.remove('faded'); rp.classList.add('hop');
    burstEl(rp, 26); sfx.fanfare(); startConfetti(1.6);
  }, 600);
  setTimeout(function(){
    if (f !== flow) return;
    st.style.visibility = ''; st.classList.add('pop'); sfx.sparkle(); burstEl(st, 16);
  }, 1500);
  setTimeout(function(){ if (f === flow) rp.classList.remove('hop'); rp.classList.add('bob'); }, 3800);
  var t = 'Hooray! ' + p.name + '’s colors are back! A rainbow stripe came back too. You earned the ' + p.markName + ' sticker!';
  if (all) t += ' All the ponies are happy! Tap Big celebration!';
  else t += ' Tap Next pony to help a new friend.';
  prompt(t);
}
function mkBtn(label, cls, fn){
  var b = document.createElement('button'); b.className = 'bigbtn ' + cls; b.textContent = label;
  b.addEventListener('click', function(){ sfx.tap(); fn(); });
  return b;
}

/* ================= book ================= */
function openBook(ret){
  bookReturn = ret || (screen === 'play' || screen === 'intro' ? 'intro' : screen);
  if (bookReturn === 'book') bookReturn = 'map';
  show('book');
  var pg = $('#bookPage'); pg.innerHTML = '';
  PONIES.forEach(function(p){
    var have = state.stickers.indexOf(p.id) >= 0;
    var b = document.createElement('button'); b.className = 'slot' + (have ? '' : ' locked');
    b.innerHTML = '<div class="sticker"><div class="inner" style="background:'+(have ? p.body : 'transparent')+'">'+svgBox(markSVG(p.mark))+'</div></div><div class="lbl">'+(have ? p.name : '?')+'</div>';
    b.addEventListener('click', function(){
      var s = b.querySelector('.sticker'); retrigger(s, 'wiggle');
      if (have) { sfx.sparkle(); burstEl(s, 10); say(p.name + '’s ' + p.markName + ' sticker!'); }
      else { sfx.tap(); say('Help a pony to fill this spot!'); }
    });
    pg.appendChild(b);
  });
  var rc = $('#rainbowCount');
  rc.innerHTML = state.rainbows > 0 ? '<span>Rainbows made: ' + state.rainbows + '</span>' + rainbowSVG([0,1,2,3,4,5], -1) : '';
  var n = state.stickers.length;
  prompt(n === 0 ? 'Your sticker book is empty. Help a pony to get a sticker!' : n === PONIES.length ? 'You have all six stickers! Wow!' : 'You have ' + n + ' sticker' + (n === 1 ? '' : 's') + '! Help more ponies to fill your book.');
}
$('#btnBookBack').addEventListener('click', function(){
  sfx.tap();
  if (bookReturn === 'intro' && cur && cur.pony) goIntro(cur.pony);
  else if (bookReturn === 'party') goParty(true);
  else if (bookReturn === 'title') { show('title'); }
  else goMap();
});

/* ================= party ================= */
function goParty(noCount){
  if (!noCount) { state.rainbows++; save(); }
  show('party');
  $('#partyRainbow').innerHTML = rainbowSVG([0,1,2,3,4,5], -1, true);
  $('#partyPonies').innerHTML = PONIES.map(function(p, i){ return '<div class="pony hop" style="animation-delay:'+(i*0.11)+'s">'+ponySVG(p)+'</div>'; }).join('');
  sfx.fanfare(); setTimeout(sfx.fanfare, 1500);
  startConfetti(0);
  prompt('You did it, Lia! You helped every pony. The rainbow is back! Friendship magic is shining bright!');
}
$('#btnAgain').addEventListener('click', function(){ sfx.tap(); state.helped = []; save(); goMap(); });
$('#btnPartyBook').addEventListener('click', function(){ sfx.tap(); openBook('party'); });

/* ================= top bar ================= */
function syncToggles(){
  $('#btnVoice').classList.toggle('off', !state.voice);
  $('#btnSound').classList.toggle('off', !state.sound);
}
$('#btnHome').addEventListener('click', function(){ sfx.tap(); goMap(); });
$('#btnBook').addEventListener('click', function(){ sfx.tap(); if (screen !== 'book') openBook(); });
$('#btnHear').addEventListener('click', function(){ retrigger($('#btnHear'), 'bounce'); if (!state.voice) { state.voice = true; syncToggles(); save(); } say(lastPrompt || 'Tap a pony to play!'); });
$('#btnVoice').addEventListener('click', function(){
  state.voice = !state.voice; save(); syncToggles(); sfx.tap();
  if (!state.voice) { try { speechSynthesis.cancel(); } catch(e){} } else say('Voice is on!');
});
$('#btnSound').addEventListener('click', function(){ state.sound = !state.sound; save(); syncToggles(); sfx.tap(); });
$('#btnPlay').addEventListener('click', function(){ initAudio(); sfx.good(); goMap(); });
$('#btnGo').addEventListener('click', function(){ sfx.tap(); if (cur && cur.pony) startActivity(cur.pony); });
document.addEventListener('pointerdown', initAudio, true);
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('dblclick', function(e){ e.preventDefault(); });

/* ================= boot ================= */
syncToggles();
renderTitle();
show('title');
lastPrompt = 'Welcome to Pony Friendship Quest! Tap Play to start.';
})();
</script>
</body>
</html>
