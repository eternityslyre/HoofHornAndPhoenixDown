<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ladybug and Cat Noir Day Saver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --red:#ec2b3f; --ink:#1d1a2e; --pink:#ff7fb0; --btnH:min(11vh,13vw,78px); }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; overscroll-behavior:none; touch-action:manipulation;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  body{ font-family:'Andika','Comic Sans MS',system-ui,sans-serif; color:var(--ink);
    background:linear-gradient(#8fd3ff,#d9f1ff 60%,#ffe3f0); }
  #app{ position:fixed; inset:0; display:flex; flex-direction:column; }
  #top{ flex:none; display:flex; align-items:center; gap:min(2vw,12px); padding:max(6px,env(safe-area-inset-top)) 12px 6px; }
  #badgeBox{ display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.85); border-radius:999px;
    padding:4px 14px 4px 6px; box-shadow:0 4px 0 rgba(0,0,0,.08); }
  #badge{ height:min(8.5vh,12vw,62px); width:auto; display:block; }
  #badgeTxt{ font:800 min(4.2vh,5.5vw,30px) 'Grandstander',sans-serif; color:var(--red); }
  #badge .spot{ fill:rgba(29,26,46,.18); stroke:rgba(29,26,46,.35); stroke-width:2; stroke-dasharray:4 3; transition:fill .4s; }
  #badge .spot.on{ fill:var(--ink); stroke:none; }
  #badge .spot.new{ animation:spotIn .9s ease-out; transform-box:fill-box; transform-origin:center; }
  @keyframes spotIn{ 0%{transform:scale(0)} 60%{transform:scale(1.8)} 100%{transform:scale(1)} }
  #titleTxt{ flex:1; min-width:0; text-align:center; font:800 min(4vh,4.2vw,30px) 'Grandstander',sans-serif; color:#fff;
    text-shadow:0 3px 0 var(--red),0 0 12px rgba(236,43,63,.4); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .icon{ flex:none; width:var(--btnH); height:var(--btnH); border-radius:50%; border:0; background:#fff; cursor:pointer;
    box-shadow:0 5px 0 #d9b7c6; display:grid; place-items:center; padding:0; }
  .icon:active{ transform:translateY(3px); box-shadow:0 2px 0 #d9b7c6; }
  .icon svg{ width:62%; height:62%; }
  .icon.small{ width:calc(var(--btnH)*.8); height:calc(var(--btnH)*.8); }
  .icon.off{ background:#e8e3ea; }
  #hear{ background:#ffe14d; box-shadow:0 5px 0 #d4a900; }
  #stageWrap{ flex:1; min-height:0; position:relative; }
  #stage{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:manipulation; }
  #bottom{ flex:none; display:flex; align-items:center; gap:14px; padding:10px 16px max(10px,env(safe-area-inset-bottom));
    background:rgba(255,255,255,.92); border-radius:26px 26px 0 0; box-shadow:0 -4px 18px rgba(120,40,80,.15);
    min-height:min(15vh,120px); }
  #caption{ flex:1; font-weight:700; font-size:min(3.6vh,4.6vw,30px); line-height:1.25; color:#4a2440; }
  #actions{ display:flex; gap:12px; flex:none; flex-wrap:wrap; justify-content:center; }
  .btn{ font:800 min(4.2vh,5.6vw,34px) 'Grandstander',sans-serif; border:0; border-radius:999px; cursor:pointer;
    padding:0 1.1em; min-height:var(--btnH); color:#fff; background:var(--pink); box-shadow:0 6px 0 #c94d82;
    text-shadow:0 2px 0 rgba(0,0,0,.18); white-space:nowrap; }
  .btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #c94d82; }
  .btn.green{ background:#35c46a; box-shadow:0 6px 0 #22924c; }
  .btn.ghost{ background:#fff; color:#c94d82; box-shadow:0 6px 0 #e6c3d3; text-shadow:none; font-size:min(3vh,4.2vw,24px); }
  .btn.lucky{ color:#fff; text-shadow:0 2px 0 var(--ink);
    background:
      radial-gradient(circle at 12% 30%, var(--ink) 0 7px, transparent 8px),
      radial-gradient(circle at 88% 68%, var(--ink) 0 7px, transparent 8px),
      radial-gradient(circle at 30% 82%, var(--ink) 0 5px, transparent 6px),
      radial-gradient(circle at 72% 18%, var(--ink) 0 5px, transparent 6px),
      var(--red);
    box-shadow:0 6px 0 #9c1022; }
  .pulse{ animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse{ 50%{ transform:scale(1.08); } }
  .wiggle{ animation:wiggleB .5s ease-in-out 2; }
  @keyframes wiggleB{ 25%{transform:rotate(-6deg) scale(1.1)} 75%{transform:rotate(6deg) scale(1.1)} }
  @media (max-aspect-ratio:1/1){
    #bottom{ flex-direction:column; align-items:stretch; text-align:center; }
    #titleTxt{ display:none; }
  }
  /* overlay */
  #cel{ position:fixed; inset:0; display:none; place-items:center; background:rgba(255,230,240,.55); z-index:5; }
  #cel.show{ display:grid; animation:fadeIn .3s; }
  @keyframes fadeIn{ from{opacity:0} }
  .card{ background:#fff; border-radius:34px; padding:min(3vh,24px) min(4vw,34px); width:min(92vw,640px); text-align:center;
    box-shadow:0 10px 0 #f2b8cf,0 20px 40px rgba(150,30,80,.25); animation:popIn .5s cubic-bezier(.3,1.6,.5,1); }
  @keyframes popIn{ from{ transform:scale(.4); } }
  #celTitle{ font:900 min(9vh,12vw,76px) 'Grandstander',sans-serif; color:var(--red); line-height:1;
    text-shadow:0 4px 0 #ffd23f; margin-bottom:8px; }
  .celRow{ display:flex; align-items:center; gap:12px; margin:6px 0 16px; }
  #celCat{ width:min(26vw,22vh,160px); flex:none; }
  .bubble{ position:relative; flex:1; background:#eef9f0; border:4px solid #35c46a; border-radius:24px; padding:12px 14px;
    font-weight:700; font-size:min(3.3vh,4.6vw,26px); text-align:left; color:#1e5131; }
  .bubble:before{ content:''; position:absolute; left:-18px; top:40%; border:10px solid transparent; border-right:14px solid #35c46a; }
  #fxc{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:9; }
  /* svg animation classes */
  .tb,.bob,.shake,.fall,.floaty,.wig,.spin,.halo,.bounce,.hop,.flut,.sway,.dance{ transform-box:fill-box; transform-origin:center; }
  .bob{ animation:bob 2.2s ease-in-out infinite; }
  @keyframes bob{ 50%{ transform:translateY(-7px); } }
  .d2{ animation-delay:-1.1s; }
  .shake{ animation:shake .3s linear infinite; }
  @keyframes shake{ 0%,100%{transform:rotate(0)} 25%{transform:rotate(-4deg)} 75%{transform:rotate(4deg)} }
  .fall{ animation:fall 3s linear infinite; }
  @keyframes fall{ 0%{transform:translateY(0) rotate(0);opacity:0} 10%{opacity:1} 85%{opacity:1} 100%{transform:translateY(320px) rotate(300deg);opacity:0} }
  .floaty{ animation:floaty 2.6s ease-in-out infinite alternate; }
  @keyframes floaty{ to{ transform:translate(10px,-26px); } }
  .wig{ animation:wig 1.3s ease-in-out infinite; }
  @keyframes wig{ 50%{ transform:rotate(14deg) translateY(-5px); } }
  .spin{ animation:spin 5s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .halo{ animation:halo 1.1s ease-in-out infinite; pointer-events:none; }
  @keyframes halo{ 50%{ transform:scale(1.12); opacity:.6; } }
  .bounce{ animation:bounce .7s ease-in-out infinite; }
  @keyframes bounce{ 50%{ transform:translateY(-18px); } }
  .hop{ animation:hop .7s ease-in-out infinite; }
  @keyframes hop{ 50%{ transform:translateY(-16px); } }
  .dance{ animation:dance 1s ease-in-out infinite; }
  @keyframes dance{ 0%,100%{transform:translateY(0) rotate(0)} 25%{transform:translateY(-20px) rotate(-6deg)} 75%{transform:translateY(-20px) rotate(6deg)} }
  .flut{ animation:flut .12s linear infinite alternate; }
  @keyframes flut{ to{ transform:scaleY(.4); } }
  .sway{ animation:sway 3s ease-in-out infinite; }
  @keyframes sway{ 50%{ transform:rotate(3deg); } }
  .twinkle{ animation:tw 1s ease-in-out infinite alternate; }
  @keyframes tw{ from{opacity:.25} to{opacity:1} }
  .nopt{ pointer-events:none; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="badgeBox" aria-label="Spots saved">
      <svg id="badge" viewBox="0 0 120 104">
        <line x1="52" y1="12" x2="42" y2="0" stroke="#1d1a2e" stroke-width="3" stroke-linecap="round"/>
        <line x1="68" y1="12" x2="78" y2="0" stroke="#1d1a2e" stroke-width="3" stroke-linecap="round"/>
        <ellipse cx="60" cy="60" rx="50" ry="42" fill="#ec2b3f" stroke="#1d1a2e" stroke-width="4"/>
        <line x1="60" y1="26" x2="60" y2="101" stroke="#1d1a2e" stroke-width="3"/>
        <circle cx="60" cy="22" r="16" fill="#1d1a2e"/>
        <circle cx="54" cy="19" r="4" fill="#fff"/><circle cx="66" cy="19" r="4" fill="#fff"/>
        <circle class="spot" cx="38" cy="46" r="9"/><circle class="spot" cx="82" cy="46" r="9"/>
        <circle class="spot" cx="30" cy="70" r="9"/><circle class="spot" cx="90" cy="70" r="9"/>
        <circle class="spot" cx="44" cy="90" r="8"/><circle class="spot" cx="76" cy="90" r="8"/>
      </svg>
      <span id="badgeTxt">0/6</span>
    </div>
    <div id="titleTxt">Ladybug &amp; Cat Noir Day Saver</div>
    <button class="icon small" id="voiceBtn" aria-label="Voice on or off"></button>
    <button class="icon small" id="soundBtn" aria-label="Sound on or off"></button>
    <button class="icon" id="hear" aria-label="Hear it again">
      <svg viewBox="0 0 48 48"><path d="M8 18h8l11-9v30l-11-9H8z" fill="#1d1a2e"/><path d="M32 16q6 8 0 16M37 11q11 13 0 26" stroke="#1d1a2e" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div id="stageWrap"><svg id="stage" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div id="bottom">
    <div id="caption">Tap Play to start!</div>
    <div id="actions"></div>
  </div>
</div>
<div id="cel">
  <div class="card">
    <div id="celTitle">Spots off!</div>
    <div class="celRow">
      <svg id="celCat" viewBox="-70 -215 140 150"></svg>
      <div class="bubble" id="celLine"></div>
    </div>
    <button class="btn green pulse" id="celNext">Next!</button>
  </div>
</div>
<canvas id="fxc"></canvas>

<script>
"use strict";
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const SV = $('#stage');
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const KEY = 'lia-ladybug-day-saver-v1';

/* ---------------- save ---------------- */
let save = { stage: 0, voice: true, sound: true, days: 0 };
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && typeof s === 'object') save = Object.assign(save, s); } catch (e) {}
function persist() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} }

/* ---------------- audio ---------------- */
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, dur = .15, type = 'sine', vol = .16, when = 0, slide = 0) {
  if (!save.sound) return; const c = ac(); if (!c) return;
  const t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .015);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + .05);
}
function noise(dur = .4, vol = .12, f1 = 400, f2 = 2400) {
  if (!save.sound) return; const c = ac(); if (!c) return;
  const len = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = c.createBufferSource(), bp = c.createBiquadFilter(), g = c.createGain(), t = c.currentTime;
  s.buffer = b; bp.type = 'bandpass'; bp.Q.value = 1.2;
  bp.frequency.setValueAtTime(f1, t); bp.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.value = vol; s.connect(bp); bp.connect(g); g.connect(c.destination); s.start();
}
const MEL = [523, 587, 659, 784, 880, 1047, 1175, 1319];
const SFX = {
  tap: () => tone(700, .07, 'triangle', .1),
  pop: (i = 0) => tone(420 + i * 45, .1, 'sine', .2, 0, 900 + i * 60),
  plop: (i = 0) => tone(300 + i * 30, .12, 'triangle', .14, 0, 160),
  sparkle: () => [1047, 1319, 1568, 2093, 2637].forEach((f, i) => tone(f, .22, 'triangle', .08, i * .06)),
  magic: () => { [523, 659, 784, 1047, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, .18, 'sine', .1, i * .07)); noise(.6, .05, 800, 5000); },
  oops: () => { tone(520, .14, 'sine', .1); tone(440, .2, 'sine', .1, .12); },
  yay: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, .25, 'triangle', .14, i * .11)); tone(1047, .6, 'triangle', .12, .5); tone(1319, .6, 'sine', .08, .5); },
  whoosh: () => noise(.45, .14, 300, 3000),
  boing: () => tone(220, .3, 'sine', .18, 0, 520),
  note: i => { tone(MEL[i % MEL.length], .3, 'triangle', .14); tone(MEL[i % MEL.length] * 2, .2, 'sine', .04); },
  boom: () => { noise(.5, .06, 200, 900); tone(1400, .3, 'sine', .03, .05, 2400); }
};

/* ---------------- speech ---------------- */
let voice = null, lastSay = '';
function pickVoice() {
  if (!window.speechSynthesis) return;
  const en = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  const pref = ['Samantha', 'Google US English', 'Aria', 'Jenny', 'Ava', 'Zira', 'Karen', 'Moira', 'Tessa', 'Serena', 'Female', 'Google UK English Female'];
  for (const p of pref) { const v = en.find(v => v.name.includes(p)); if (v) { voice = v; return; } }
  voice = en.find(v => /en-US/i.test(v.lang)) || en[0] || null;
}
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let sayId = 0;
function speak(text, opt = {}) {
  lastSay = text; $('#caption').textContent = text;
  const id = ++sayId;
  return new Promise(res => {
    const fallback = Math.min(9000, 900 + text.length * 70);
    if (!save.voice || !window.speechSynthesis) { setTimeout(res, Math.min(2600, 600 + text.length * 35)); return; }
    try { speechSynthesis.cancel(); } catch (e) {}
    let done = false; const fin = () => { if (!done) { done = true; res(); } };
    setTimeout(() => {
      if (id !== sayId) { fin(); return; }
      const u = new SpeechSynthesisUtterance(text);
      if (voice) u.voice = voice; u.lang = voice ? voice.lang : 'en-US';
      u.rate = opt.rate || .92; u.pitch = opt.pitch || 1.15;
      u.onend = fin; u.onerror = fin;
      try { speechSynthesis.speak(u); } catch (e) { fin(); }
      setTimeout(fin, fallback);
    }, 70);
  });
}

/* ---------------- top bar ---------------- */
const ICON_VOICE = on => `<svg viewBox="0 0 48 48"><path d="M8 10h32a4 4 0 0 1 4 4v16a4 4 0 0 1-4 4H22l-9 8v-8H8a4 4 0 0 1-4-4V14a4 4 0 0 1 4-4z" fill="${on ? '#ff7fb0' : '#aaa'}"/><circle cx="16" cy="22" r="3" fill="#fff"/><circle cx="24" cy="22" r="3" fill="#fff"/><circle cx="32" cy="22" r="3" fill="#fff"/>${on ? '' : '<line x1="6" y1="42" x2="42" y2="6" stroke="#e8283c" stroke-width="5" stroke-linecap="round"/>'}</svg>`;
const ICON_SOUND = on => `<svg viewBox="0 0 48 48"><path d="M18 34V10l20-4v24" stroke="${on ? '#6a5cff' : '#aaa'}" stroke-width="4" fill="none"/><ellipse cx="13" cy="35" rx="7" ry="5.5" fill="${on ? '#6a5cff' : '#aaa'}"/><ellipse cx="33" cy="31" rx="7" ry="5.5" fill="${on ? '#6a5cff' : '#aaa'}"/>${on ? '' : '<line x1="6" y1="42" x2="42" y2="6" stroke="#e8283c" stroke-width="5" stroke-linecap="round"/>'}</svg>`;
function drawToggles() {
  const vb = $('#voiceBtn'), sb = $('#soundBtn');
  vb.innerHTML = ICON_VOICE(save.voice); vb.classList.toggle('off', !save.voice);
  sb.innerHTML = ICON_SOUND(save.sound); sb.classList.toggle('off', !save.sound);
}
$('#voiceBtn').addEventListener('click', () => {
  save.voice = !save.voice; persist(); drawToggles();
  if (!save.voice && window.speechSynthesis) speechSynthesis.cancel(); else speak(lastSay || 'Voice is on!');
});
$('#soundBtn').addEventListener('click', () => { save.sound = !save.sound; persist(); drawToggles(); SFX.tap(); });
$('#hear').addEventListener('click', () => {
  const was = save.voice; save.voice = true; speak(lastSay || 'Tap Play to start!'); save.voice = was;
});
document.addEventListener('pointerdown', () => ac(), { once: false, passive: true });

function updateBadge(animNew) {
  const n = spotsDone();
  document.querySelectorAll('#badge .spot').forEach((s, i) => {
    s.classList.toggle('on', i < n);
    s.classList.remove('new');
    if (animNew && i === n - 1) { void s.getBBox(); s.classList.add('new'); }
  });
  $('#badgeTxt').textContent = n + '/6';
}

/* ---------------- buttons ---------------- */
function setButtons(list) {
  const box = $('#actions'); box.innerHTML = '';
  list.forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn ' + (b.cls || ''); el.textContent = b.label;
    el.addEventListener('click', () => { SFX.tap(); b.fn(); });
    box.appendChild(el);
  });
}
function wiggleBtn() { const b = $('#actions .btn'); if (!b) return; b.classList.remove('wiggle'); void b.offsetWidth; b.classList.add('wiggle'); }

/* ---------------- fx canvas ---------------- */
const FX = $('#fxc'), fctx = FX.getContext('2d');
let parts = [], fxRun = false;
function sizeFx() { const d = Math.min(2, window.devicePixelRatio || 1); FX.width = innerWidth * d; FX.height = innerHeight * d; fctx.setTransform(d, 0, 0, d, 0, 0); }
sizeFx();
const CC = ['#ec2b3f', '#ffd23f', '#3ccf6e', '#4aa8ff', '#ff7fc8', '#a77bff', '#1d1a2e', '#ff9f43'];
function confetti(n = 160) {
  const W = innerWidth, H = innerHeight;
  for (let i = 0; i < n; i++) parts.push({ x: W / 2 + rnd(-W * .25, W * .25), y: H * .3 + rnd(-40, 40), vx: rnd(-9, 9), vy: rnd(-15, -4), g: .3,
    r: rnd(5, 10), rot: rnd(0, 6), vr: rnd(-.3, .3), c: pick(CC), s: pick(['rect', 'circ', 'spot', 'rect']), life: 1, fade: rnd(.004, .008) });
  runFx();
}
function firework(x, y) {
  const c = pick(CC), c2 = pick(CC);
  for (let i = 0; i < 48; i++) { const a = i / 48 * Math.PI * 2, sp = rnd(2.5, 6);
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: .05, r: rnd(2.5, 4.5), rot: 0, vr: 0, c: i % 3 ? c : c2, s: 'circ', life: 1, fade: .013, drag: .975 }); }
  runFx();
}
function runFx() {
  if (fxRun) return; fxRun = true;
  const step = () => {
    fctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 40);
    for (const p of parts) {
      if (p.drag) { p.vx *= p.drag; p.vy *= p.drag; }
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.vx *= .995; p.rot += p.vr; p.life -= p.fade;
      fctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.6)); fctx.fillStyle = p.c;
      fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.rot);
      if (p.s === 'rect') fctx.fillRect(-p.r, -p.r * .45, p.r * 2, p.r * .9);
      else if (p.s === 'spot') { fctx.fillStyle = '#ec2b3f'; fctx.beginPath(); fctx.arc(0, 0, p.r, 0, 7); fctx.fill();
        fctx.fillStyle = '#1d1a2e'; fctx.beginPath(); fctx.arc(-p.r * .35, -p.r * .2, p.r * .28, 0, 7); fctx.arc(p.r * .4, p.r * .3, p.r * .24, 0, 7); fctx.fill(); }
      else { fctx.beginPath(); fctx.arc(0, 0, p.r, 0, 7); fctx.fill(); }
      fctx.restore();
    }
    fctx.globalAlpha = 1;
    if (parts.length) requestAnimationFrame(step); else { fxRun = false; fctx.clearRect(0, 0, innerWidth, innerHeight); }
  };
  requestAnimationFrame(step);
}

/* ---------------- svg helpers ---------------- */
function A(el, frames, dur, opt = {}) {
  if (!el || !el.animate) return Promise.resolve();
  try { return el.animate(frames, Object.assign({ duration: dur, easing: 'ease-in-out', fill: 'forwards' }, opt)).finished.catch(() => {}); }
  catch (e) { return Promise.resolve(); }
}
function starPts(r, r2 = r * .45) {

async function runMixup(i, def) {
  newStage(); const my = token;
  let phase = 'call', misses = 0, charm = null;
  const cp = def.cpos;
  const ay = Math.max(80, def.ty - def.tr * .7);
  SV.innerHTML = DEFS + def.scene() + heroes() + arrowAt(def.tx, ay) +
    `<g transform="translate(${cp[0]} ${cp[1]})" class="nopt"><g id="charmMove"><g id="charmPop" class="tb" style="opacity:0"></g></g></g><g id="fx"></g>`;
  speak(def.intro + ' Tap Lucky Charm!');
  setButtons([{ label: 'Lucky Charm!', cls: 'lucky pulse', fn: () => callCharm() }]);
  onTap = e => {
    if (phase === 'call') { speak('Tap the Lucky Charm button!'); wiggleBtn(); return; }
    if (phase !== 'use') return;
    if (e.target.closest && e.target.closest('.tgt')) { phase = 'fix'; useCharm(); return; }
    misses++; SFX.oops();
    if (misses >= 2) { SV.querySelector('#arrow').style.display = ''; speak(`Look at the yellow arrow. Tap the ${def.tName}!`); }
    else speak(`Oops! Try the glowing ${def.tName}.`);
  };
  async function callCharm() {
    if (phase !== 'call') return; phase = 'charming'; setButtons([]);
    SFX.magic();
    const fx = SV.querySelector('#fx');
    const yo = el('g', { transform: 'translate(108 515)', class: 'nopt' }, `<circle r="12" fill="#ec2b3f" stroke="#1d1a2e" stroke-width="3"/><circle r="3" fill="#1d1a2e"/>`);
    fx.appendChild(yo);
    await A(yo.firstElementChild ? yo : yo, [{ transform: 'translate(108px,515px)' }, { transform: `translate(${cp[0]}px,${cp[1]}px)` }], 550, { easing: 'ease-out' });
    yo.remove();
    if (my !== token) return;
    charm = pick(def.charms);
    const pop = SV.querySelector('#charmPop');
    pop.innerHTML = `<circle r="76" fill="#fff" opacity=".93" stroke="#ffd6e0" stroke-width="7"/>` + CH[charm.k];
    burst(cp[0], cp[1], 20); SFX.sparkle();
    await A(pop, [{ transform: 'scale(0) rotate(-200deg)', opacity: 0 }, { transform: 'scale(1.25) rotate(10deg)', opacity: 1 }, { transform: 'scale(1) rotate(0deg)', opacity: 1 }], 700);
    if (my !== token) return;
    SV.querySelector('#halo').style.display = '';
    phase = 'use';
    speak(`${charm.say} Tap the glowing ${def.tName}!`);
  }
  async function useCharm() {
    SV.querySelector('#halo').style.display = 'none'; SV.querySelector('#arrow').style.display = 'none';
    SFX.whoosh(); burst(def.tx, def.ty, 12);
    await A(SV.querySelector('#charmMove'), [{ transform: 'translate(0px,0px) scale(1)' }, { transform: `translate(${def.tx - cp[0]}px,${def.ty - cp[1]}px) scale(.75)` }], 650, { easing: 'ease-in' });
    if (my !== token) return;
    A(SV.querySelector('#charmPop'), [{ transform: 'scale(1) rotate(0deg)', opacity: 1 }, { transform: 'scale(1.1) rotate(-15deg)', opacity: 1 }, { transform: 'scale(1.1) rotate(15deg)', opacity: 1 }, { transform: 'scale(.2) rotate(0deg)', opacity: 0 }], 900);
    await def.fix(charm);
    if (my !== token) return;
    await speak(def.done);
    if (my !== token) return;
    complete(i, 'Spots off!', def.cat, true);
  }
}

      <rect x="${L - 8}" y="${r.top - 6}" width="${W + 16}" height="14" rx="5" fill="#7184b4"/>
      <rect x="${L + 20}" y="${r.top - 46}" width="20" height="40" fill="#c97b5a"/><rect x="${L + W - 44}" y="${r.top - 36}" width="18" height="30" fill="#c97b5a"/>`;
    for (let yy = r.top + 30; yy < 700; yy += 56) for (let xx = L + 20; xx < L + W - 30; xx += 46)
      world += `<rect x="${xx}" y="${yy}" width="26" height="34" rx="4" fill="#9fd0f0" stroke="#fff" stroke-width="3"/><rect x="${xx - 4}" y="${yy + 34}" width="34" height="5" fill="#3b3f5c"/>`;
    world += `<g id="glow${k}" style="opacity:0" class="nopt"><ellipse cx="${r.x}" cy="${r.top}" rx="105" ry="20" fill="url(#gGlow)"/><g transform="translate(${r.x} ${r.top - 70})"><g class="bounce"><polygon points="${starPts(26)}" fill="#ffe14d" stroke="#ff9f43" stroke-width="4"/></g></g></g></g>`;
  });
  anchors.forEach(a => world += `<g transform="translate(${a.x} ${a.y})">${cloud(0, 0, .55, '#fff')}<g class="spin" style="animation-duration:6s"><polygon points="${starPts(16)}" fill="#ffd23f" stroke="#fff" stroke-width="3"/></g></g>`);
  SV.innerHTML = DEFS + `<rect x="-1500" y="-900" width="4000" height="2600" fill="url(#gSky)"/>` + sun(900, 80) +
    `<g id="par">${farSky(560, false, 5, -700, 3000)}${tower(900, 560, 330, false)}</g>
     <g id="world">${world}<line id="yo" x1="0" y1="0" x2="0" y2="0" stroke="#1d1a2e" stroke-width="4" stroke-linecap="round" style="display:none"/>
     <g id="sh"><g id="shr"><g transform="scale(.6)">${heroine({ arm: 'up' })}</g></g></g></g><g id="fx"></g>`;
  const sh = SV.querySelector('#sh'), shr = SV.querySelector('#shr'), yoL = SV.querySelector('#yo'), wg = SV.querySelector('#world'), par = SV.querySelector('#par');
  let cur = 0, mode = 'ready', t0 = 0, misses = 0, cam = roofs[0].x + 180 - 500, th0 = 0, L = 0, A0 = null, bob = { x: roofs[0].x, y: roofs[0].top }, th = 0;
  let land = null, throwT = 0;
  const OM = Math.PI * 2 / 2.8, S = .6;
  function hand(bx, by, phi) { const hx = 14 * S, hy = -170 * S; return [bx + hx * Math.cos(phi) - hy * Math.sin(phi), by + hx * Math.sin(phi) + hy * Math.cos(phi)]; }
  function frame(now) {
    if (my !== token) return;
    let phi = 0, glowOn = 0;
    if (mode === 'throw' || mode === 'swing') {
      const tt = mode === 'swing' ? (now - t0) / 1000 : 0;
      th = th0 * Math.cos(OM * tt);
      bob = { x: A0.x + L * Math.sin(th), y: A0.y + L * Math.cos(th) };
      phi = -th * .9;
      const p = th / Math.abs(th0); glowOn = p > .45 ? 1 : .3;
      const h = hand(bob.x, bob.y, phi);
      let k = 1; if (mode === 'throw') { k = Math.min(1, (now - throwT) / 260); if (k >= 1) { mode = 'swing'; t0 = now; } }
      yoL.style.display = ''; yoL.setAttribute('x1', h[0]); yoL.setAttribute('y1', h[1]);
      yoL.setAttribute('x2', h[0] + (A0.x - h[0]) * k); yoL.setAttribute('y2', h[1] + (A0.y - h[1]) * k);
    } else if (mode === 'land') {
      const k = Math.min(1, (now - land.t) / 480);
      bob = { x: land.fx + (land.tx - land.fx) * k, y: land.fy + (land.ty - land.fy) * k - Math.sin(Math.PI * k) * 60 };
      phi = land.phi * (1 - k); yoL.style.display = 'none';
      if (k >= 1) { mode = 'ready'; cur++; bob = { x: land.tx, y: land.ty }; afterLand(); }
    } else { yoL.style.display = 'none'; glowOn = .45; }
    for (let k = 0; k < 4; k++) { const g = SV.querySelector('#glow' + k); if (g) g.style.opacity = (k === cur + 1 && cur < 3) ? glowOn : 0; }
    sh.setAttribute('transform', `translate(${bob.x.toFixed(1)} ${bob.y.toFixed(1)})`);
    shr.setAttribute('transform', `rotate(${(phi * 180 / Math.PI).toFixed(1)})`);
    const target = (cur < 3 ? (roofs[cur].x + roofs[cur + 1].x) / 2 : roofs[3].x) - 500;
    cam += (target - cam) * .06;
    wg.setAttribute('transform', `translate(${(-cam).toFixed(1)} 0)`);
    par.setAttribute('transform', `translate(${(-cam * .3).toFixed(1)} 0)`);
    requestAnimationFrame(frame);
  }
  function startSwing() {
    A0 = anchors[cur]; const P0 = { x: roofs[cur].x, y: roofs[cur].top };
    th0 = Math.atan2(P0.x - A0.x, P0.y - A0.y); L = Math.hypot(P0.x - A0.x, P0.y - A0.y);
    mode = 'throw'; throwT = performance.now(); misses = 0; SFX.whoosh();
    speak('Wheee! Tap when the next roof sparkles!');
  }
  function doLand() {
    const P1 = { x: roofs[cur + 1].x, y: roofs[cur + 1].top };
    land = { t: performance.now(), fx: bob.x, fy: bob.y, tx: P1.x, ty: P1.y, phi: -th * .9 };
    mode = 'land'; SFX.boing();
  }
  function afterLand() {
    burst(roofs[cur].x - cam, roofs[cur].top - 20, 14);
    SFX.sparkle();
    if (cur >= 3) { setTimeout(() => { if (my === token) complete(i, 'Super swing!', 'Wow! You swing like a superstar! I swing like a sleepy kitty.', false); }, 700); return; }
    speak(pick(['Great landing!', 'You did it!', 'Super!']) + ' Tap to swing again!');
  }
  onTap = () => {
    if (mode === 'ready' && cur < 3) { startSwing(); return; }
    if (mode === 'swing') {
      const p = th / Math.abs(th0);
      if (p > .45 || misses >= 2) { doLand(); return; }
      misses++; SFX.oops();
      speak(misses >= 2 ? 'Almost! Tap one more time and you will land!' : 'Almost! Wait until the next roof sparkles, then tap!');
    }
  };
  speak('Time to swing over the rooftops! Tap to throw your yo-yo!');
  requestAnimationFrame(frame);
}

/* ---------------- spot the difference ---------------- */
const DIFFS = {
  sun: { c: [62, 64] }, cloud: { c: [190, 52] }, awning: { c: [115, 214] }, cat: { c: [112, 132] }, balloon: { c: [282, 150] }, flower: { c: [240, 286] }
};
function pic(ch) {
  let s = `<rect width="460" height="380" fill="#bfe8ff"/><rect y="300" width="460" height="80" fill="#f7dfb5"/>`;
  s += ch.sun ? sun(62, 64, true).replace('translate(62 64)', 'translate(62 64) scale(.7)') : sun(62, 64, false).replace('translate(62 64)', 'translate(62 64) scale(.7)');
  if (!ch.cloud) s += cloud(190, 52, .65);
  s += tower(370, 300, 230, false);
  s += `<rect x="30" y="150" width="170" height="150" fill="#fde9d0" stroke="#e8cfae" stroke-width="2"/><polygon points="24,150 206,150 192,128 38,128" fill="#7486b5"/>
    <rect x="48" y="160" width="30" height="30" rx="3" fill="#9fd0f0" stroke="#fff" stroke-width="3"/><rect x="150" y="160" width="30" height="30" rx="3" fill="#9fd0f0" stroke="#fff" stroke-width="3"/>
    <rect x="24" y="202" width="182" height="24" fill="url(#${ch.awning ? 'stripesB' : 'stripes'})"/>
    <rect x="50" y="240" width="70" height="50" rx="4" fill="#bfe3f7" stroke="#fff" stroke-width="3"/><rect x="140" y="240" width="40" height="60" rx="4" fill="#b5546b"/>`;
  if (!ch.cat) s += `<g transform="translate(112 128)"><ellipse cx="0" cy="-12" rx="14" ry="12" fill="#1d1a2e"/><circle cx="0" cy="-30" r="11" fill="#1d1a2e"/><polygon points="-10,-36 -8,-48 -2,-39" fill="#1d1a2e"/><polygon points="10,-36 8,-48 2,-39" fill="#1d1a2e"/><circle cx="-4" cy="-31" r="2.4" fill="#ffe14d"/><circle cx="4" cy="-31" r="2.4" fill="#ffe14d"/><path d="M12,-6 Q28,-10 24,-26" stroke="#1d1a2e" stroke-width="4" fill="none"/></g>`;
  s += `<path d="M282,182 q6,30 -4,56 q-6,26 -4,52" stroke="#666" stroke-width="2" fill="none"/><g transform="translate(282 150)">${balloon(ch.balloon ? '#ffd23f' : '#ec2b3f')}</g>`;
  const fc = ch.flower ? '#a77bff' : '#ff7fc8';
  s += `<g transform="translate(240 300)"><line x1="-12" y1="-20" x2="-14" y2="-38" stroke="#3a9a4a" stroke-width="3"/><line x1="0" y1="-20" x2="0" y2="-44" stroke="#3a9a4a" stroke-width="3"/><line x1="12" y1="-20" x2="14" y2="-38" stroke="#3a9a4a" stroke-width="3"/>
    <circle cx="-14" cy="-40" r="8" fill="${fc}"/><circle cx="0" cy="-46" r="9" fill="${fc}"/><circle cx="14" cy="-40" r="8" fill="${fc}"/><circle cx="-14" cy="-40" r="3" fill="#ffe14d"/><circle cx="0" cy="-46" r="3" fill="#ffe14d"/><circle cx="14" cy="-40" r="3" fill="#ffe14d"/>
    <path d="M-20,-22 L20,-22 L14,0 L-14,0Z" fill="#d9774a"/></g>`;
  return s;
}
function runDiff(i) {
  newStage(); const my = token;
  const chosen = Object.keys(DIFFS).sort(() => Math.random() - .5).slice(0, 3);
  const found = new Set(); let misses = 0, hintOn = null;
  const chB = {}; chosen.forEach(k => chB[k] = true);
  function render() {
    const portrait = innerWidth / Math.max(1, innerHeight) < .9;
    const vb = portrait ? [520, 900] : [1000, 620];
    SV.setAttribute('viewBox', `0 0 ${vb[0]} ${vb[1]}`);
    const P = portrait ? [[30, 90], [30, 500]] : [[25, 130], [515, 130]];
    let s = DEFS + `<rect x="-1500" y="-900" width="4000" height="2600" fill="url(#gSky)"/>`;
    sd = 21; for (let k = 0; k < 18; k++) s += `<circle cx="${(sr() * vb[0]).toFixed(0)}" cy="${(sr() * vb[1]).toFixed(0)}" r="${(6 + sr() * 10).toFixed(0)}" fill="#fff" opacity=".35"/>`;
    const sx = vb[0] / 2, sy = portrait ? 48 : 70;
    for (let k = 0; k < 3; k++) s += `<g transform="translate(${sx + (k - 1) * 80} ${sy})"><polygon points="${starPts(30)}" fill="${k < found.size ? '#ffd23f' : '#ffffff'}" stroke="${k < found.size ? '#ff9f43' : '#d8c6ee'}" stroke-width="5" stroke-linejoin="round"/></g>`;
    P.forEach((p, pi) => {
      s += `<g transform="translate(${p[0]} ${p[1]})" class="panel"><rect x="-8" y="-8" width="476" height="396" rx="32" fill="#fff"/><g clip-path="url(#clipP)">${pic(pi === 0 ? {} : chB)}</g>`;
      chosen.forEach(k => {
        const c = DIFFS[k].c;
        if (found.has(k)) s += `<circle cx="${c[0]}" cy="${c[1]}" r="44" fill="none" stroke="#ff3d7f" stroke-width="7"/><circle cx="${c[0]}" cy="${c[1]}" r="44" fill="none" stroke="#fff" stroke-width="2"/>`;
        else s += `<circle class="dhit" data-d="${k}" cx="${c[0]}" cy="${c[1]}" r="56" fill="rgba(0,0,0,0)"/>`;
        if (hintOn === k && !found.has(k)) s += `<circle cx="${c[0]}" cy="${c[1]}" r="50" fill="url(#gGlow)" class="halo"/>`;
      });
      s += `</g>`;
    });
    s += `<g id="fx"></g>`;
    SV.innerHTML = s;
    return P;
  }
  let P = render();
  onResize = () => { if (my === token) P = render(); };
  speak('Cat Noir took two pictures of Paris. They are a little different. Find 3 differences and tap them!');
  onTap = e => {
    const t = e.target.closest && e.target.closest('.dhit');
    if (t) {
      const k = t.dataset.d; if (found.has(k)) return;
      found.add(k); hintOn = null; misses = 0; SFX.sparkle();
      P = render();
      const c = DIFFS[k].c; P.forEach(p => burst(p[0] + c[0], p[1] + c[1], 14));
      if (found.size >= 3) {
        speak('You found all 3! Amazing eyes!');
        setTimeout(() => { if (my === token) complete(i, 'Super eyes!', 'Sharp eyes! Even sharper than my cat eyes. And I can see in the dark!', false); }, 1400);
      } else speak(`You found one! ${3 - found.size} more to go.`);
      return;
    }
    misses++; SFX.oops();
    if (misses >= 2) { hintOn = chosen.find(k => !found.has(k)); P = render(); speak('Look where it sparkles! Tap there.'); }
    else speak('Look closely at both pictures. Try again!');
  };
}

/* ---------------- party ---------------- */
function runParty() {
  newStage(); const my = token;
  save.days = (save.days || 0) + 1; persist(); updateBadge(false);
  let flags = ''; for (let k = 0; k < 14; k++) flags += `<polygon points="${80 + k * 60},${60 + Math.sin(k / 13 * Math.PI) * 50} ${120 + k * 60},${60 + Math.sin((k + .66) / 13 * Math.PI) * 50} ${100 + k * 60},${100 + Math.sin((k + .33) / 13 * Math.PI) * 50}" fill="${CC[k % 6]}"/>`;
  let bl = ''; [[120, 180], [210, 130], [790, 130], [880, 180], [160, 300], [850, 300]].forEach((p, k) => bl += `<g transform="translate(${p[0]} ${p[1]})"><g class="bob tb" style="animation-delay:-${k * .4}s"><path d="M0,32 q8,22 0,44 q-8,22 0,40" stroke="#eee" stroke-width="2" fill="none"/>${balloon(BALC[k])}</g></g>`);
  let nt = ''; for (let k = 0; k < 5; k++) nt += `<g transform="translate(${300 + k * 100} ${200 + (k % 2) * 40})"><g class="wig tb" style="animation-delay:-${k * .3}s">${noteShape(CC[k])}</g></g>`;
  let tw = ''; [[-36, -8], [0, -8], [36, -8], [-18, -26], [18, -26], [0, -44]].forEach((p, k) => tw += `<g transform="translate(${p[0]} ${p[1]})">${macaron(MACC[k % 5])}</g>`);
  const hats = ['#ff7fc8', '#4aa8ff', '#ffd23f'];
  let pg = ''; [700, 760, 820].forEach((x, k) => pg += `<g transform="translate(${x} 540) scale(.75)"><g class="hop tb" style="animation-delay:-${k * .2}s">${pigeon(hats[k])}</g></g>`);
  SV.innerHTML = DEFS + bg({ night: true, tower: { x: 500, h: 400 }, gy: 520 }) +
    `<path d="M60,60 Q500,170 940,60" stroke="#fff" stroke-width="3" fill="none"/>${flags}${bl}${nt}
     <g transform="translate(250 520)"><ellipse cx="0" cy="0" rx="50" ry="10" fill="#fff"/><g transform="translate(0 -6)">${tw}<g transform="translate(0 -64)">${croissant()}</g></g></g>
     <g transform="translate(150 560) scale(.7)"><g class="dance">${mime(true)}</g></g>
     ${pg}
     <g transform="translate(880 560) scale(.95)"><g class="hop tb">${dog(true)}</g></g>
     <g transform="translate(410 600) scale(.85)"><g class="dance">${heroine({ arm: 'both' })}</g></g>
     <g transform="translate(590 600) scale(.85)"><g class="dance d2">${catHero({ arm: 'both' })}</g></g>
     <g id="fx"></g>`;
  confetti(220); SFX.yay();
  speak(`Hooray! You saved the day, Lia! All of Paris is having a big party for you! You saved ${save.days} ${save.days === 1 ? 'day' : 'days'} so far.`);
  const fw = setInterval(() => { if (my !== token) return; firework(rnd(.15, .85) * innerWidth, rnd(.12, .4) * innerHeight); SFX.boom(); }, 900);
  loops.push(fw);
  onTap = e => { const r = SV.getBoundingClientRect(); firework(e.clientX, e.clientY); SFX.boom(); };
  setButtons([{ label: 'Play again!', cls: 'lucky pulse', fn: () => { save.stage = 0; persist(); updateBadge(false); showTransform(); } }]);
}

/* ---------------- router ---------------- */
function runStage(i) {
  if (i >= PLAN.length - 1) { save.stage = PLAN.length - 1; persist(); runParty(); return; }
  save.stage = i; persist(); updateBadge(false);
  const k = PLAN[i];
  if (MIX[k]) runMixup(i, MIX[k]);
  else if (k === 'swing') runSwing(i);
  else if (k === 'diff') runDiff(i);
}

drawToggles();
showTitle();
</script>
