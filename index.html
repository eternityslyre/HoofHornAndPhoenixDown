<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lia's Phoenix Jewels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@600;800&display=swap">
<style>
/* Layout: one full-screen painted world (canvas) with chunky storybook panels floating over it */
:root{
  --ink:#3a1d5c; --ink-soft:#6b4f8f;
  --flame:#ff6a3d; --flame-deep:#c93d16;
  --gold:#ffc83d; --gold-deep:#c98d00;
  --lilac:#a77cff; --lilac-deep:#6c43c9;
  --mint:#3fc28c; --mint-deep:#23885f;
  --panel:rgba(255,248,255,.93); --panel-line:#ffd98a;
  --night:#241a4a; --white:#ffffff;
  --display:'Grandstander','Trebuchet MS','Comic Sans MS',system-ui,sans-serif;
  --body:'Andika','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#app{position:relative;height:100%;overflow:hidden}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.screen{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:16px;padding-inline:16px;padding-block:64px 24px;box-sizing:border-box;touch-action:pan-y}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.05}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--white);outline-offset:3px}
.btn{font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,4vw,1.8rem);padding:.45em 1.3em .5em;border:0;border-radius:999px;background:var(--flame);color:var(--white);box-shadow:0 6px 0 var(--flame-deep),0 10px 24px rgba(30,10,60,.3);letter-spacing:.02em;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--flame-deep)}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 6px 0 var(--gold-deep),0 10px 24px rgba(30,10,60,.3)}
.btn.gold:active{box-shadow:0 2px 0 var(--gold-deep)}
.btn.lilac{background:var(--lilac);box-shadow:0 6px 0 var(--lilac-deep),0 10px 24px rgba(30,10,60,.3)}
.btn.lilac:active{box-shadow:0 2px 0 var(--lilac-deep)}
.btn.mint{background:var(--mint);box-shadow:0 6px 0 var(--mint-deep),0 10px 24px rgba(30,10,60,.3)}
.btn.mint:active{box-shadow:0 2px 0 var(--mint-deep)}
.btn[disabled]{filter:grayscale(.8);opacity:.55}
.panel{background:var(--panel);border:4px solid var(--panel-line);border-radius:28px;box-shadow:0 12px 40px rgba(20,8,50,.35);padding:16px;box-sizing:border-box}
.icon-btn{flex-shrink:0;width:52px;height:52px;border-radius:50%;border:3px solid var(--white);background:rgba(58,29,92,.55);color:var(--white);display:grid;place-items:center;padding:0}
.icon-btn svg{width:28px;height:28px}
.icon-btn.off{opacity:.55}
#corner{position:absolute;top:10px;right:10px;display:flex;gap:8px;z-index:20}
#caption{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:19;max-width:min(88vw,620px);font-family:var(--display);font-weight:600;font-size:clamp(1.05rem,3.4vw,1.45rem);text-align:center;background:rgba(58,29,92,.82);color:var(--white);padding:.5em 1em;border-radius:20px;pointer-events:none;opacity:0;transition:opacity .3s}
#caption.on{opacity:1}
#app[data-s="s-play"] #caption{bottom:auto;top:96px}

/* Title */
#s-title{justify-content:center;text-align:center}
.logo{font-size:clamp(2.6rem,10vw,5.6rem);font-weight:800;color:var(--gold);-webkit-text-stroke:2px var(--flame-deep);text-shadow:0 5px 0 var(--flame-deep),0 0 30px rgba(255,180,60,.7);transform:rotate(-2deg)}
.logo small{display:block;font-size:.45em;color:var(--white);-webkit-text-stroke:0;text-shadow:0 3px 0 var(--lilac-deep);margin-top:.2em;transform:rotate(1deg)}
#playBtn{font-size:clamp(1.8rem,6vw,2.6rem);margin-top:24px}

/* Make your hero */
.make{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;width:min(900px,100%);align-items:center}
.make canvas{width:100%;height:auto;aspect-ratio:4/3;max-width:100%;border-radius:22px;background:linear-gradient(#ffd6ec,#fff3d6)}
.opt{display:flex;flex-direction:column;gap:6px}
.opt h3{font-size:1.15rem;color:var(--ink-soft)}
.sw-row{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:46px;height:46px;border-radius:50%;border:4px solid var(--white);box-shadow:0 2px 6px rgba(0,0,0,.25);padding:0}
.sw.sel{border-color:var(--flame);transform:scale(1.12)}
.name{font-family:var(--display);font-weight:600;font-size:1.1rem;padding:.35em .8em;border-radius:999px;border:3px solid var(--lilac);background:var(--white)}
.name.sel{background:var(--lilac);color:var(--white)}
@media (max-width:640px){.make{grid-template-columns:minmax(0,1fr)}}

/* Map */
.title-big{font-size:clamp(1.8rem,6vw,2.8rem);color:var(--white);text-shadow:0 4px 0 var(--lilac-deep);text-align:center}
.lands{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:min(860px,100%)}
.land{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:8px;border-radius:24px;border:4px solid var(--white);background:var(--panel);box-shadow:0 8px 0 rgba(58,29,92,.35);text-align:left}
.land:active{transform:translateY(3px)}
.land canvas{width:100%;height:auto;aspect-ratio:16/9;border-radius:16px;display:block}
.land .row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-inline:4px;flex-wrap:wrap}
.land b{font-family:var(--display);font-size:clamp(1.05rem,3.4vw,1.4rem)}
.land .gems img{width:26px;height:26px}
.land.locked canvas{filter:saturate(.5) brightness(.75)}
.land .need{display:inline-flex;align-items:center;gap:6px;font-size:.95rem;letter-spacing:0}
.land .need img{width:28px;height:28px}
.stars{color:var(--gold-deep);font-size:1.1rem;letter-spacing:2px;font-family:var(--display)}
.dock{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
.bagline{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;font-family:var(--display);font-weight:800;font-size:1.2rem;color:var(--ink);padding:8px 16px;border-radius:999px;background:var(--panel)}
.bagline span{display:inline-flex;align-items:center;gap:2px;font-variant-numeric:tabular-nums}
.bagline img{width:30px;height:30px}

/* Play HUD */
.play{pointer-events:none;padding:0}
.play > *{pointer-events:auto}
.hud-top{position:absolute;top:10px;left:10px;right:130px;display:flex;align-items:center;gap:10px}
.sockets{display:flex;flex-wrap:wrap;gap:4px;background:rgba(58,29,92,.45);padding:6px 10px;border-radius:999px;border:3px solid rgba(255,255,255,.7)}
.sock{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center}
.sock img{width:30px;height:30px;animation:pop .4s ease-out}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.35)}100%{transform:scale(1)}}
.fire{position:absolute;right:18px;bottom:18px;width:104px;height:104px;border-radius:50%;border:0;padding:0;
  background:conic-gradient(var(--gold) calc(var(--e,1)*360deg),rgba(255,255,255,.25) 0);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.fire span{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffb15c,var(--flame) 60%,var(--flame-deep));display:grid;place-items:center}
.fire svg{width:52px;height:52px;color:#fff3b0}
.fire.bird span{background:radial-gradient(circle at 40% 35%,#fff,#e6dcff 60%,var(--lilac))}
.fire.bird svg{color:var(--lilac-deep)}
.fire.tired{filter:saturate(.3) brightness(.9)}
.breath{position:absolute;right:30px;bottom:136px;width:76px;height:76px;border-radius:50%;border:4px solid #fff3b0;padding:0;background:radial-gradient(circle at 40% 35%,#ffe08a,#ff8a2e 60%,#e2471f);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(120,30,0,.35)}
.breath[hidden]{display:none}
.breath svg{width:44px;height:44px}
.breath:active{transform:scale(.92)}
.breath.a2{right:132px;bottom:32px}
.breath.gust{background:radial-gradient(circle at 40% 35%,#ffffff,#bfe8ff 60%,#6fb8f0);border-color:#ffffff;color:#2a6aa8}
.breath.beam{background:radial-gradient(circle at 40% 35%,#ffffff,#f3e6ff 60%,#c9a2ff);border-color:#ffffff}
.breath.dash{background:radial-gradient(circle at 40% 35%,#fff6c8,#ffd23f 60%,#e09a00);border-color:#ffffff;color:#fff}
#app[data-s="s-play"] .powers{right:224px}
.wish{position:absolute;left:12px;top:74px;display:flex;align-items:center;gap:6px;padding:4px 12px 4px 6px;border-radius:999px;background:rgba(255,248,255,.88);border:3px solid #ffd23f;font-family:var(--display);color:#5a2d82;font-size:1.05rem;pointer-events:none}
.wish[hidden]{display:none}
.wish img{width:30px;height:30px}
.wish.done{border-color:#7ad38f;color:#2e8a5a}
.powers{position:absolute;left:12px;bottom:16px;right:140px;display:flex;flex-wrap:wrap-reverse;gap:8px;pointer-events:none}
.powers button{pointer-events:auto;width:58px;height:58px;border-radius:50%;border:3px solid var(--gold);background:rgba(255,248,255,.85);padding:0;display:grid;place-items:center}
.powers img{width:46px;height:46px}
.win{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 32px));text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.win h2{font-size:clamp(2.2rem,8vw,3.2rem);color:var(--flame)}
.win .haul{display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.win .haul img{width:38px;height:38px}
.puzzle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;z-index:4}
.puzzle h2{display:flex;align-items:center;gap:8px;font-size:clamp(1.6rem,6vw,2.3rem);color:var(--flame)}
.puzzle h2 img{width:72px;height:72px}
.puzzle p{margin:0}
.pzsub{font-family:var(--display);color:var(--ink-soft);font-size:1rem}
.needs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;text-align:left;font-size:1.2rem;font-family:var(--display)}
.needs li{display:flex;align-items:center;gap:8px}
.needs li::before{content:'';width:24px;height:24px;flex:none;border-radius:50%;border:3px solid var(--lilac);box-sizing:border-box}
.needs li.ok::before{content:'✓';border-color:#3fc28c;background:#3fc28c;color:#fff;display:grid;place-items:center;font-size:.9rem;font-weight:800}
.pzfam{font-size:.95rem;color:var(--ink-soft);max-width:44ch}
.pztext{font-size:1.25rem;font-family:var(--display);font-weight:700}
.pzrow{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;align-items:center}
.pzrow:empty,.pzpick:empty,.pzfam:empty{display:none}
.pzrow img{width:50px;height:50px}
.pzrow .q{width:50px;height:50px;border-radius:50%;border:3px dashed var(--flame);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.8rem;color:var(--flame)}
.pzpick{display:flex;gap:14px;justify-content:center}
.pzpick button{width:84px;height:84px;border-radius:22px;border:4px solid var(--white);background:var(--panel);padding:0;display:grid;place-items:center;box-shadow:0 4px 0 rgba(58,29,92,.25)}
.pzpick img{width:64px;height:64px}
.pzpick button.no{opacity:.3}
.pzpick button.hint{border-color:var(--gold);animation:twinkle 1s ease-in-out infinite}
@keyframes twinkle{50%{box-shadow:0 0 22px 6px var(--gold);transform:scale(1.06)}}
/* Ultra gems list on the map */
.ultras{width:min(860px,100%);display:flex;flex-direction:column;gap:8px}
.ultras h3{color:var(--white);text-shadow:0 3px 0 var(--lilac-deep);font-size:clamp(1.3rem,4.5vw,1.8rem);text-align:center;margin:0}
.urow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:20px;border:4px solid var(--white);background:var(--panel);text-align:left}
.urow img{width:58px;height:58px;flex:none}
.urow.locked img{opacity:.55;filter:saturate(.5)}
.urow div{display:flex;flex-direction:column;gap:2px;min-width:0}
.urow b{font-family:var(--display);font-size:1.15rem}
.urow small{font-size:.95rem;color:var(--ink-soft)}
.urow .ok{color:#2f9a6a;font-weight:700}

/* Workshop */
.bar{width:min(900px,100%);display:flex;align-items:center;gap:12px}
.bar h2{flex:1;font-size:clamp(1.5rem,5vw,2.3rem);color:var(--white);text-shadow:0 3px 0 var(--lilac-deep)}
.back{background:var(--panel);color:var(--ink);border:0}
.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:min(900px,100%)}
.type{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:20px;border:4px solid var(--white);background:var(--panel)}
.type.sel{border-color:var(--flame);background:#fff1e6}
.type canvas{width:100%;max-width:110px;height:auto;aspect-ratio:1}
.type b{font-family:var(--display);font-size:clamp(.95rem,3vw,1.2rem)}
.type .need{display:flex;gap:1px}
.type .need i{width:9px;height:9px;border-radius:50%;background:var(--lilac);display:block}
.bench{width:min(900px,100%);display:flex;flex-direction:column;align-items:center;gap:10px}
#bench{width:min(460px,100%);height:auto;aspect-ratio:460/250;border-radius:24px;background:radial-gradient(ellipse at 50% 60%,#fff6e0,#f3dcff)}
.bag{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:min(900px,100%)}
.gembtn{position:relative;width:72px;height:72px;border-radius:20px;border:3px solid var(--white);background:var(--panel);padding:0;display:grid;place-items:center}
.gembtn img{width:56px;height:56px}
.gembtn em{position:absolute;right:-6px;top:-8px;min-width:26px;height:26px;border-radius:13px;background:var(--flame);color:var(--white);font-style:normal;font-family:var(--display);font-weight:800;font-size:1rem;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.gembtn[disabled]{opacity:.35}
.result{position:absolute;inset:0;background:rgba(36,26,74,.6);display:grid;place-items:center;padding:16px;z-index:5}
.result .panel{width:min(480px,100%);text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.result canvas{width:min(300px,80%);height:auto;aspect-ratio:300/200}
.result h2{font-size:clamp(1.7rem,6vw,2.4rem);color:var(--flame)}
.result p{font-size:1.25rem;margin:0}

/* Treasure box */
.box{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;width:min(900px,100%)}
.jcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;border-radius:22px;border:4px solid var(--panel-line);background:var(--panel)}
.jcard canvas{width:100%;height:auto;aspect-ratio:3/2}
.jcard b{font-family:var(--display);font-size:1.1rem;text-align:center}
.jcard small{font-size:.95rem;color:var(--ink-soft);text-align:center}
.jcard{position:relative}
.jcard.worn{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,210,63,.45)}
.jcard .wear{position:absolute;top:6px;right:8px;padding:2px 10px;border-radius:12px;background:var(--gold);color:#5a3a00;font-family:var(--display);font-weight:800;font-size:.85rem}
.wearline{color:var(--white);font-family:var(--display);font-size:1.1rem;text-align:center;margin:0 0 10px}
.powers button.gp{width:46px;height:46px;border-color:var(--white)}
.powers button.gp img{width:36px;height:36px}
.empty{color:var(--white);font-family:var(--display);font-size:1.3rem;text-align:center;max-width:30ch}
@media (max-width:560px){.sock{width:20px;height:20px}.sock img{width:24px;height:24px}.sockets{gap:3px;padding:5px 8px}#app[data-s="s-play"] #caption{top:112px}}
@media (prefers-reduced-motion:reduce){.sock img{animation:none}.btn{transition:none}}
</style>
</head>
<body>

<div id="app">
  <canvas id="world" aria-label="Game world"></canvas>

  <div id="corner">
    <button class="icon-btn" id="sndBtn" aria-label="Sound on or off">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    </button>
    <button class="icon-btn" id="voiceBtn" aria-label="Read aloud on or off">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H10l-5 4v-4H4z"/><path d="M8 10.5h.01M12 10.5h.01M16 10.5h.01" stroke-width="3"/></svg>
    </button>
  </div>
  <div id="caption" role="status" aria-live="polite"></div>

  <!-- Title -->
  <section class="screen" id="s-title">
    <h1 class="logo">Lia's Phoenix Jewels<small>a unicorn &amp; phoenix adventure</small></h1>
    <button class="btn" id="playBtn">Play!</button>
  </section>

  <!-- Make your hero -->
  <section class="screen" id="s-make" hidden>
    <h2 class="title-big">Who is going on the adventure?</h2>
    <div class="make panel">
      <canvas id="preview" width="480" height="360"></canvas>
      <div class="opt" id="opts"></div>
    </div>
    <button class="btn mint" id="readyBtn">Let's go!</button>
  </section>

  <!-- Map -->
  <section class="screen" id="s-map" hidden>
    <h2 class="title-big">Where shall we fly today?</h2>
    <div class="bagline" id="mapBag"></div>
    <div class="lands" id="lands"></div>
    <div class="ultras" id="ultras"></div>
    <div class="dock">
      <button class="btn gold" id="toShop">Jewelry Workshop</button>
      <button class="btn lilac" id="toBox">Treasure Box</button>
      <button class="btn mint" id="toMake">Change look</button>
    </div>
  </section>

  <!-- Play -->
  <section class="screen play" id="s-play" hidden>
    <div class="hud-top">
      <button class="icon-btn" id="homeBtn" aria-label="Back to the map"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 11.5 12 3.5l9 8V21h-6.5v-6h-5v6H3z"/></svg></button>
      <div class="sockets" id="sockets" aria-label="Gems found"></div>
    </div>
    <div class="powers" id="powers"></div>
    <button class="fire" id="fireBtn" aria-label="Turn into a phoenix"><span><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.5 1.5c.8 4.2 6 6 6 11.5a6.5 6.5 0 0 1-13 0c0-2.8 1.4-4.6 2.8-5.8-.1 2.4 1 3.8 2.4 4.1-.6-3.8.3-6.8 1.8-9.8z"/></svg></span></button>
    <button class="breath" id="breathBtn" aria-label="Breathe warm phoenix fire" hidden><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 12c3-1 5-4 9-4 3 0 4 2 4 2s3-3 6-2c-2 1-3 3-3 4s1 3 3 4c-3 1-6-2-6-2s-1 2-4 2c-4 0-6-3-9-4z"/></svg></button>
    <button class="breath a2 gust" id="gustBtn" aria-label="Wing gust" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h8"/></svg></button>
    <button class="breath beam" id="beamBtn" aria-label="Rainbow beam" hidden><svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round"><path d="M3 18a9 9 0 0 1 18 0" stroke="#ff6f91"/><path d="M6 18a6 6 0 0 1 12 0" stroke="#ffd23f"/><path d="M9 18a3 3 0 0 1 6 0" stroke="#4fa8ff"/></svg></button>
    <button class="breath a2 dash" id="dashBtn" aria-label="Gallop dash" hidden><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg></button>
    <div class="wish" id="wishChip" hidden></div>
    <div class="panel puzzle" id="puzzle" hidden>
      <h2><span id="pzGem"></span><span id="pzTitle"></span></h2>
      <p class="pzsub">Ultra shiny gem vault</p>
      <ol class="needs" id="pzNeeds"></ol>
      <p class="pzfam" id="pzFam"></p>
      <p class="pztext" id="pzText"></p>
      <div class="pzrow" id="pzRow"></div>
      <div class="pzpick" id="pzPick"></div>
      <button class="btn lilac" id="pzCloseBtn">Close</button>

  const wear = save.worn.length < WEAR; if (wear) save.worn.push(at);
  persist();
  shop.busy = false;
  const c = $('#resultCv').getContext('2d'); c.clearRect(0, 0, 600, 400); drawJewel(c, 300, 210, 330, type, gems, 1.5);
  const gw = gemPowerWords(gems), ww = wear ? 'You are wearing it!' : 'Put it on in your Treasure Box!', lw = lookWords(gems);
  $('#resultName').textContent = 'The ' + name + '!';
  $('#resultPower').textContent = lw + ' ' + (isNew ? 'New power: ' : 'Power: ') + JEWELS[type].power + '. ' + JEWELS[type].desc
    + ' ' + pw + ' ' + gw + ' ' + ww;
  $('#result').hidden = false;
  SFX.win();
  say(`You made the ${name}! ${lw} ${isNew ? 'New power, ' : ''}${JEWELS[type].power}! ${JEWELS[type].desc} ${pw} ${gw} ${ww}`);
  shop.type = null; shop.gems = []; buildTypes(); buildBag(); updEnchant();
}
$('#resultOk').addEventListener('click', () => { $('#result').hidden = true; SFX.tap(); });

/* ---------- Treasure box ---------- */
function buildBox() {
  if (!save.jewels.length) {
    const box = $('#box'); box.innerHTML = ''; $('#wearline').textContent = '';
    const p = document.createElement('p'); p.className = 'empty'; p.textContent = 'Your treasure box is empty. Make jewelry in the workshop!';
    box.append(p); say(p.textContent); return;
  }
  renderBox();
  say(`You have ${save.jewels.length} magic ${save.jewels.length === 1 ? 'treasure' : 'treasures'}! Tap one to put it on or take it off. You can wear ${WEAR}!`);
}
// Wearing jewelry: only the treasures you wear help on adventures, so each land plays differently
function renderBox() {
  const box = $('#box'); box.innerHTML = '';
  save.worn = save.worn.filter(a => save.jewels.some(j => j.at === a));
  $('#wearline').textContent = `Wearing ${save.worn.length} of ${WEAR}. Tap a treasure to put it on or take it off!`;
  save.jewels.slice().reverse().forEach(j => {
    const worn = isWorn(j);
    const b = document.createElement('button'); b.className = 'jcard' + (worn ? ' worn' : '');
    const c = document.createElement('canvas'); c.width = 300; c.height = 200; drawJewel(c.getContext('2d'), 150, 106, 165, j.type, j.gems, 1.3);
    const n = document.createElement('b'); n.textContent = j.name;
    const jb = gemBoost(j.gems);
    const p = document.createElement('small');
    p.textContent = JEWELS[j.type].power + (jb >= 1 ? ' (super powered!)' : jb ? ' (powered up)' : '') + ' · ' + [...new Set(GEM_ORDER.filter(k => j.gems.includes(k)).map(k => GEM_POWERS[k].power))].join(', ');
    b.append(c, n, p);
    if (worn) { const t = document.createElement('span'); t.className = 'wear'; t.textContent = 'Wearing'; b.append(t); }
    b.addEventListener('click', () => {
      if (isWorn(j)) { save.worn = save.worn.filter(a => a !== j.at); SFX.tap(); say(`You took off the ${j.name}.`); }
      else if (save.worn.length >= WEAR) { SFX.nope(); say(`You can wear ${WEAR} treasures at once. Take one off first!`); return; }
      else { save.worn.push(j.at); SFX.magic(); say(`You put on the ${j.name}! ${JEWELS[j.type].power}! ${JEWELS[j.type].desc} ${gemPowerWords(j.gems)}`); }
      persist(); renderBox();
    });
    box.append(b);
  });
}

/* ---------- Multiplayer (only when played through the local server) ---------- */
// Each player sends where they are and where they're heading. Movement in this game is
// "glide toward the tapped spot at a fixed speed", so other screens can play that same glide
// forward from the last update instead of waiting for the next one, which hides network lag.
const others = new Map(); // id -> { s: latest state, recv: when it arrived, ux, x, y, phase, t }
let mpSock = null, mpGap = 0, mpLast = '';
function mpConnect() {
  if (!window.__LIVE__) return;
  try { mpSock = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/play'); } catch (e) { return; }
  mpSock.onmessage = e => {
    let m; try { m = JSON.parse(e.data); } catch (er) { return; }
    if (m.t === 'state') { const o = others.get(m.id) || { phase: 0, t: Math.random() * 9 }; o.s = m.s; o.recv = performance.now(); others.set(m.id, o); }
    else if (m.t === 'gone') others.delete(m.id);
  };
  mpSock.onclose = () => { others.clear(); setTimeout(mpConnect, 2000); };
}
const r3 = v => Math.round(v * 1000) / 1000;
function mpTick(dt) {
  if (!mpSock || mpSock.readyState !== 1) return;
  const g = screen === 's-play' && game ? game : null;
  // What the player intends (land, form, tap target) goes out at once; positions ride along 15 times a second.
  const intent = g ? [g.land.id, g.form, r3(g.tx / W), r3(g.ty / H)].join() : 'menu';
  mpGap += dt;
  if (mpGap < (intent === mpLast ? 1 / 15 : 1 / 30)) return;
  mpGap = 0; mpLast = intent;
  const st = g ? { land: g.land.id, ux: r3(g.ux / W), uface: g.uface, mv: g.umoving, form: g.form, px: r3(g.px / W), py: r3(g.py / H), pface: g.pface,
                   tx: r3(g.tx / W), ty: r3(g.ty / H), fast: hasPower('bracelet'), wing: hasPower('brooch'), look: save.look, pet: g.pet ? [g.pet.kind, g.pet.gem] : null }
               : { land: null, look: save.look };
  mpSock.send(JSON.stringify({ t: 'state', s: st }));
}
function glide(x, y, tx, ty, dist) { // move (x,y) toward (tx,ty) by up to dist
  const dx = tx - x, dy = ty - y, d = Math.hypot(dx, dy);
  return d <= dist || d < 1e-6 ? [tx, ty] : [x + dx / d * dist, y + dy / d * dist];
}
function drawOthers(c, dt) {
  const g = game, mine = save.look, now = performance.now();
  for (const o of others.values()) {
    const s = o.s; if (!s || s.land !== g.land.id) continue;
    // Where they most likely are right now: last report, played forward for the time since it was sent.
    const age = Math.min(.5, (now - o.recv) / 1000 + .04);
    const uSpeed = 300 * S * (s.fast ? 1.7 : 1);
    const ux = s.form === 'ride' ? glide(s.ux * W, 0, clamp(s.tx * W, 60 * S, W - 60 * S), 0, uSpeed * age)[0] : s.ux * W;
    let px = s.px * W, py = s.py * H;
    if (s.form === 'phoenix') [px, py] = glide(px, py, clamp(s.tx * W, 30 * S, W - 30 * S), clamp(s.ty * H, 50 * S, GY - 70 * S), 420 * S * (s.wing ? 1.4 : 1) * age);
    else if (s.form === 'landing') [px, py] = glide(px, py, ux + (s.uface || 1) * -6 * S, GY - 120 * S, 520 * S * age);
    const k = Math.min(1, dt * 14), snap = o.ux === undefined || o.form !== s.form && s.form !== 'landing';
    o.ux = snap ? ux : o.ux + (ux - o.ux) * k;
    o.x = snap ? px : o.x + (px - o.x) * k;
    o.y = snap ? py : o.y + (py - o.y) * k;
    o.form = s.form;
    o.t += dt; if (s.mv) o.phase += dt * (s.fast ? 18 : 13);
    save.look = Object.assign({}, DEF.look, s.look); // draw them in their own colors
    c.save(); c.globalAlpha = .9;
    drawUnicorn(c, o.ux, GY, S, s.uface || 1, { t: o.t, phase: o.phase, moving: s.mv, rider: s.form === 'ride' });
    if (s.form !== 'ride') drawPhoenix(c, o.x, o.y, S * 1.25, s.pface || 1, o.t);
    if (Array.isArray(s.pet) && GEMS[s.pet[1]]) drawPet(c, { kind: String(s.pet[0]), gem: s.pet[1] }, o.ux - (s.uface || 1) * 85 * S, GY, s.uface || 1, o.t, o.phase, false);
    c.restore();
    save.look = mine;
    const nx = s.form === 'ride' ? o.ux : o.x, ny = s.form === 'ride' ? GY - 200 * S : o.y - 50 * S;
    const name = String((s.look && s.look.uname) || 'Friend').slice(0, 16);
    c.save(); c.font = `bold ${Math.round(15 * S + 4)}px system-ui, sans-serif`; c.textAlign = 'center';
    c.lineWidth = 4; c.strokeStyle = 'rgba(43,26,58,.7)'; c.strokeText(name, nx, ny); c.fillStyle = '#fff'; c.fillText(name, nx, ny);
    c.restore();
  }
}
mpConnect();

/* ---------- Main loop ---------- */
let last = performance.now(), frameDt = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt; frameDt = dt;
  mpTick(dt);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  stepParts(dt);
  if (screen === 's-play' && game) {
    if (!pz) updateGame(dt); // the world waits while a vault puzzle is open
    if (game) {
      updateCamera(dt);
      ctx.setTransform(DPR, 0, 0, DPR, -CX * DPR, -CY * DPR);
      drawGame();
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      drawOffscreen(ctx);
    }
  } else drawAmbient();
  if (screen === 's-make') drawPreview();
  if (screen === 's-shop') drawBench();
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
})();
</script>
